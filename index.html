<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Escape Room Card Game</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14161c">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Escape Room">

<style>
  :root {
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: #14161c;
    font-family: system-ui, -apple-system, sans-serif;
    color: #cfd3dc;
    padding: calc(24px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  }

  h1 {
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    color: #e4e7ee;
    margin: 0 0 12px;
  }

  [hidden] {
    display: none !important;
  }

  /* --- Home screen --- */

  .home-subtitle {
    text-align: center;
    font-size: 13px;
    color: #7a8194;
    margin: 0 0 28px;
  }

  .deck-grid {
    max-width: 440px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .deck-tile {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    border-radius: 14px;
    border: 2px solid #3d4250;
    background: linear-gradient(135deg, #22252e, #1a1c22);
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    color: inherit;
    width: 100%;
  }

  .deck-tile:hover {
    filter: brightness(1.08);
  }

  .deck-icon {
    font-size: 32px;
    flex-shrink: 0;
  }

  .deck-info {
    flex: 1;
    min-width: 0;
  }

  .deck-name {
    font-size: 17px;
    font-weight: 700;
    color: #e4e7ee;
  }

  .deck-tagline {
    font-size: 12px;
    color: #9aa0ad;
    margin-top: 2px;
  }

  .deck-badge {
    font-size: 11px;
    color: #7ee6a8;
    margin-top: 6px;
    font-weight: 600;
  }

  /* --- Game screen --- */

  .home-link {
    display: block;
    margin: 0 auto 16px;
    background: none;
    border: none;
    color: #9aa0ad;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    padding: 6px 10px;
  }

  .debug-next-btn {
    display: block;
    margin: 0 auto 16px;
    background: none;
    border: 1px dashed #5a6072;
    border-radius: 8px;
    color: #7a8194;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
    padding: 5px 10px;
  }

  .debug-next-btn:hover {
    color: #cfd3dc;
    border-color: #7a8194;
  }

  .table-hint-btn {
    display: block;
    margin: 0 auto 16px;
    background: rgba(255, 193, 7, 0.1);
    border: 1px solid rgba(255, 193, 7, 0.5);
    border-radius: 8px;
    color: #ffc107;
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    padding: 6px 14px;
  }

  .table-hint-btn:hover {
    background: rgba(255, 193, 7, 0.2);
  }

  .home-link:hover {
    color: #cfd3dc;
  }

  .lives {
    text-align: center;
    font-size: 26px;
    letter-spacing: 8px;
    margin-bottom: 24px;
  }

  .life {
    display: inline-block;
    transition: transform 0.25s ease, opacity 0.25s ease;
  }

  .life.lost {
    opacity: 0.35;
    transform: scale(0.85);
  }

  .scene {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }

  /* --- Deck pile --- */

  .deck-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    opacity: 1;
    transform: scale(1);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .deck-wrap.gone {
    opacity: 0;
    transform: scale(0.8);
    pointer-events: none;
  }

  .deck {
    position: relative;
    width: 120px;
    height: 168px;
    cursor: pointer;
  }

  .deck[data-empty="true"] {
    cursor: default;
    pointer-events: none;
  }

  .deck-card {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    background: repeating-linear-gradient(135deg, #2b2f3a, #2b2f3a 8px, #262a34 8px, #262a34 16px);
    border: 2px solid #3d4250;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    transition: transform 0.2s ease;
  }

  .deck:hover .deck-card {
    transform: translateY(-4px);
  }

  .deck-caption {
    text-align: center;
    font-size: 13px;
    color: #7a8194;
    line-height: 1.5;
  }

  .deck-caption strong {
    color: #b7bcc9;
    font-size: 15px;
  }

  /* --- Table --- */

  .table {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 16px;
    justify-items: center;
  }

  /* --- Card --- */

  .card {
    position: relative;
    width: 110px;
    height: 154px;
    perspective: 1000px;
    cursor: pointer;
    opacity: 1;
    transform: none;
    animation: dealIn 0.4s ease forwards;
  }

  @keyframes dealIn {
    from {
      opacity: 0;
      transform: translateY(12px) scale(0.9);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .card.wrong {
    animation: shake 0.4s ease;
    box-shadow: 0 0 0 3px rgba(224, 82, 82, 0.6);
    border-radius: 10px;
  }

  @keyframes shake {
    10%, 90% { transform: translateX(-3px); }
    20%, 80% { transform: translateX(5px); }
    30%, 50%, 70% { transform: translateX(-7px); }
    40%, 60% { transform: translateX(7px); }
  }

  .wrong-mark {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    font-weight: 800;
    color: #ff5c5c;
    text-shadow: 0 0 14px rgba(255, 92, 92, 0.85);
    opacity: 0;
    pointer-events: none;
    z-index: 5;
    transition: opacity 0.2s ease;
  }

  .card.wrong .wrong-mark {
    opacity: 1;
    animation: wrongPop 0.5s ease;
  }

  @keyframes wrongPop {
    0% { opacity: 0; transform: scale(0.4); }
    35% { opacity: 1; transform: scale(1.2); }
    60% { transform: scale(1); }
    100% { opacity: 1; transform: scale(1); }
  }

  .card.correct {
    animation: correctRing 0.6s ease;
    border-radius: 10px;
  }

  @keyframes correctRing {
    0% { box-shadow: 0 0 0 0 rgba(126, 230, 168, 0.7); }
    60% { box-shadow: 0 0 0 12px rgba(126, 230, 168, 0); }
    100% { box-shadow: 0 0 0 0 rgba(126, 230, 168, 0); }
  }

  .correct-mark {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    font-weight: 800;
    color: #7ee6a8;
    text-shadow: 0 0 14px rgba(126, 230, 168, 0.85);
    opacity: 0;
    pointer-events: none;
    z-index: 5;
    transition: opacity 0.2s ease;
  }

  .card.correct .correct-mark {
    opacity: 1;
    animation: correctPop 0.6s ease;
  }

  @keyframes correctPop {
    0% { opacity: 0; transform: scale(0.4); }
    35% { opacity: 1; transform: scale(1.25); }
    60% { transform: scale(1); }
    100% { opacity: 1; transform: scale(1); }
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.6s;
    transform-style: preserve-3d;
  }

  .card.flipped .card-inner {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px;
    box-sizing: border-box;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
    overflow: hidden;
  }

  .card-back {
    background: linear-gradient(135deg, #2b2f3a, #1a1c22);
    border: 2px solid #3d4250;
    flex-direction: column;
    gap: 4px;
  }

  .card-back .card-number {
    font-size: 40px;
    font-weight: 700;
    color: #6c7a96;
  }

  .card-front {
    background: linear-gradient(135deg, #2f6a4f, #1c3f31);
    border: 2px solid #4caf7d;
    transform: rotateY(180deg);
    flex-direction: column;
    gap: 6px;
  }

  .card-front .front-number {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: #9fd6b8;
    opacity: 0.75;
  }

  .card-front .front-icon {
    font-size: 26px;
    line-height: 1;
  }

  /* Item cards (object/combo art): the picture is the card — it fills
     almost all the space below the small number, with no competing text. */
  .card-front.has-art {
    padding: 6px;
    gap: 4px;
  }

  .card-front.has-art .front-icon {
    flex: 1;
    width: 100%;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
  }

  .card-front.has-art .front-icon .item-art {
    width: 100%;
    height: 100%;
  }

  .item-art {
    display: inline-block;
    height: 58px;
    width: auto;
    aspect-ratio: 385 / 507;
    object-fit: cover;
    border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    vertical-align: middle;
  }

  .hint .item-art {
    height: 18px;
    border-radius: 3px;
    margin: 0 2px -4px;
    box-shadow: none;
  }

  .card-front .message {
    font-size: 14px;
    font-weight: 600;
    color: #d8f5e6;
  }

  .card-front .hint {
    font-size: 10px;
    color: #9fd6b8;
  }

  .card-front.story {
    background: linear-gradient(135deg, #6a4f2f, #3f2f1c);
    border-color: #cfa04c;
  }

  .card-front.story .message {
    color: #f5e6d8;
  }

  .card-front.story .hint {
    color: #d6b89f;
  }

  .card-front.story .front-number {
    color: #d6b89f;
  }

  .card-front.win {
    background: linear-gradient(135deg, #6a3f8f, #2f1c4f);
    border-color: #b98cf0;
  }

  .card-front.win .message {
    color: #f0e6f9;
  }

  .card-front.win .hint {
    color: #d6b9f0;
  }

  .card-front.win .front-number {
    color: #d6b9f0;
  }

  .hint {
    color: #7a8194;
    font-size: 13px;
  }

  /* --- Zoom overlay --- */

  .zoom-overlay {
    position: fixed;
    inset: 0;
    background: rgba(8, 9, 12, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    padding: 16px;
  }

  .zoom-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .zoom-card {
    position: relative;
    width: min(85vw, 420px);
    aspect-ratio: 110 / 154;
    max-height: 82vh;
    background: linear-gradient(135deg, #2f6a4f, #1c3f31);
    border: 2px solid #4caf7d;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
    padding: 32px;
    transform: scale(0.85) translateY(12px);
    transition: transform 0.25s ease;
  }

  .zoom-overlay.open .zoom-card {
    transform: scale(1) translateY(0);
  }

  .zoom-card.has-puzzle {
    aspect-ratio: unset;
    width: min(92vw, 420px);
  }

  .zoom-number {
    font-size: 15px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #9fd6b8;
  }

  .zoom-message {
    font-size: 19px;
    font-weight: 700;
    line-height: 1.3;
    color: #d8f5e6;
  }

  .zoom-card.win .zoom-message,
  .zoom-card.story .zoom-message {
    font-size: 22px;
  }

  .zoom-hint {
    font-size: 14px;
    color: #9fd6b8;
  }

  .zoom-item-art {
    width: 100%;
    max-width: 260px;
    aspect-ratio: 385 / 507;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  }

  .zoom-item-art .item-art {
    width: 100%;
    height: 100%;
    border-radius: 12px;
    box-shadow: none;
  }

  .zoom-card.story {
    background: linear-gradient(135deg, #6a4f2f, #3f2f1c);
    border-color: #cfa04c;
  }

  .zoom-card.story .zoom-number {
    color: #d6b89f;
  }

  .zoom-card.story .zoom-message {
    color: #f5e6d8;
  }

  .zoom-card.story .zoom-hint {
    color: #d6b89f;
  }

  .zoom-card.win {
    background: linear-gradient(135deg, #6a3f8f, #2f1c4f);
    border-color: #b98cf0;
  }

  .zoom-card.win .zoom-number {
    color: #d6b9f0;
  }

  .zoom-card.win .zoom-message {
    color: #f0e6f9;
  }

  .zoom-card.win .zoom-hint {
    color: #d6b9f0;
  }

  .zoom-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: rgba(0, 0, 0, 0.3);
    color: #d8f5e6;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .zoom-close:hover {
    background: rgba(0, 0, 0, 0.5);
  }

  /* --- Cipher puzzle --- */

  .zoom-puzzle {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
  }

  .puzzle-instructions {
    font-size: 12px;
    color: #9fd6b8;
    line-height: 1.4;
  }

  .cipher-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 14px;
    width: 100%;
  }

  .cipher-word {
    display: flex;
    flex-wrap: nowrap;
    gap: 4px;
  }

  .cipher-letter {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .cipher-cipherchar {
    font-family: 'Courier New', monospace;
    font-size: 15px;
    font-weight: 700;
    color: #9fd6b8;
    opacity: 0.8;
  }

  .cipher-blank {
    width: 26px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 2px solid #4caf7d;
    font-size: 16px;
    font-weight: 700;
    color: #d8f5e6;
    cursor: pointer;
    border-radius: 4px;
  }

  .cipher-blank.active {
    background: rgba(76, 175, 125, 0.25);
  }

  .cipher-blank.correct {
    color: #7ee6a8;
    border-bottom-color: #7ee6a8;
  }

  .cipher-blank.wrong {
    color: #ff9a9a;
    border-bottom-color: #ff9a9a;
  }

  .cipher-keyboard {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    width: 100%;
  }

  .cipher-key {
    width: 30px;
    height: 36px;
    border-radius: 6px;
    border: none;
    background: rgba(255, 255, 255, 0.1);
    color: #d8f5e6;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }

  .cipher-key:hover {
    background: rgba(255, 255, 255, 0.18);
  }

  .cipher-key-back {
    background: rgba(224, 82, 82, 0.3);
    width: 44px;
  }

  .cipher-key-back:hover {
    background: rgba(224, 82, 82, 0.45);
  }

  .cipher-key.used {
    background: rgba(255, 255, 255, 0.04);
    color: #565c6b;
    cursor: default;
  }

  .cipher-key.used:hover {
    background: rgba(255, 255, 255, 0.04);
  }

  /* --- Slide puzzle --- */

  .slider-grid {
    display: grid;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 6px;
    justify-content: center;
  }

  .slider-tile {
    width: 56px;
    height: 56px;
    border-radius: 8px;
    border: none;
    background: rgba(255, 255, 255, 0.1);
    color: #d8f5e6;
    font-size: 22px;
    font-weight: 700;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
  }

  .slider-tile.movable {
    background: rgba(76, 175, 125, 0.28);
    cursor: pointer;
  }

  .slider-tile.movable:hover {
    background: rgba(76, 175, 125, 0.42);
  }

  .slider-tile-blank {
    visibility: hidden;
  }

  /* --- Swap puzzle --- */

  .swap-grid {
    display: grid;
    grid-template-columns: repeat(4, 46px);
    grid-template-rows: repeat(4, 46px);
    gap: 5px;
    justify-content: center;
  }

  .swap-tile {
    width: 46px;
    height: 46px;
    border-radius: 8px;
    border: none;
    background: rgba(255, 255, 255, 0.1);
    color: #d8f5e6;
    font-size: 17px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }

  .swap-tile:hover {
    background: rgba(255, 255, 255, 0.18);
  }

  .swap-tile.selected {
    background: rgba(76, 175, 125, 0.4);
    box-shadow: 0 0 0 2px #4caf7d inset;
  }

  .swap-tile.correct {
    background: rgba(76, 175, 125, 0.18);
    color: #7ee6a8;
  }

  /* --- Pipes puzzle --- */

  .pipes-grid {
    display: grid;
    gap: 4px;
    justify-content: center;
  }

  .pipe-tile {
    position: relative;
    width: 46px;
    height: 46px;
    border-radius: 6px;
    border: none;
    background: rgba(255, 255, 255, 0.06);
    cursor: pointer;
    padding: 0;
  }

  .pipe-tile:hover {
    background: rgba(255, 255, 255, 0.12);
  }

  .pipe-tile:disabled {
    cursor: default;
  }

  .pipe-tile:disabled:hover {
    background: rgba(255, 255, 255, 0.06);
  }

  .pipe-tile.empty {
    background: rgba(255, 255, 255, 0.02);
  }

  .pipe-hub {
    position: absolute;
    top: 38%;
    left: 38%;
    width: 24%;
    height: 24%;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.32);
  }

  .pipe-arm {
    position: absolute;
    background: rgba(255, 255, 255, 0.32);
  }

  .pipe-arm.n {
    top: 0;
    left: 38%;
    width: 24%;
    height: 42%;
  }

  .pipe-arm.s {
    bottom: 0;
    left: 38%;
    width: 24%;
    height: 42%;
  }

  .pipe-arm.e {
    right: 0;
    top: 38%;
    width: 42%;
    height: 24%;
  }

  .pipe-arm.w {
    left: 0;
    top: 38%;
    width: 42%;
    height: 24%;
  }

  .pipe-tile.connected .pipe-hub,
  .pipe-tile.connected .pipe-arm {
    background: #7ee6a8;
  }

  .pipe-tile.hinted {
    box-shadow: 0 0 0 2px #ffd76a inset;
  }

  .pipe-tile.start {
    box-shadow: 0 0 0 2px #4c9df0 inset;
  }

  .pipe-tile.end {
    box-shadow: 0 0 0 2px #e05252 inset;
  }

  .pipe-badge {
    position: absolute;
    top: 1px;
    left: 1px;
    font-size: 9px;
    font-weight: 800;
    line-height: 1;
    padding: 1px 3px;
    border-radius: 3px;
    color: #14161c;
    pointer-events: none;
    z-index: 2;
  }

  .pipe-badge.start {
    background: #4c9df0;
  }

  .pipe-badge.end {
    background: #e05252;
  }

  /* --- Shapes puzzle --- */

  .shapes-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
  }

  .shapes-grid {
    display: grid;
    gap: 2px;
    background: rgba(0, 0, 0, 0.25);
    padding: 4px;
    border-radius: 6px;
  }

  .shapes-cell {
    width: 38px;
    height: 38px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.06);
  }

  .shapes-cell.filled {
    cursor: grab;
    touch-action: none;
  }

  .shapes-cell.preview-valid {
    box-shadow: 0 0 0 2px #7ee6a8 inset;
  }

  .shapes-cell.preview-invalid {

    if (!item) return '';

    return item.emoji;
  }

  function orderedNumbers(count) {
    return Array.from({ length: count }, (_, i) => i + 1);
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function formatTime(ms) {
    const totalSeconds = Math.max(0, Math.round(ms / 1000));
    const m = Math.floor(totalSeconds / 60);
    const s = totalSeconds % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  // shift only special-cases spaces, so "TWENTY-ONE" would corrupt.
  const ONES_WORDS = [
    'ZERO', 'ONE', 'TWO', 'THREE', 'FOUR', 'FIVE', 'SIX', 'SEVEN', 'EIGHT', 'NINE', 'TEN',
    'ELEVEN', 'TWELVE', 'THIRTEEN', 'FOURTEEN', 'FIFTEEN', 'SIXTEEN', 'SEVENTEEN', 'EIGHTEEN', 'NINETEEN',
  ];
  const TENS_WORDS = ['', '', 'TWENTY', 'THIRTY', 'FORTY', 'FIFTY', 'SIXTY', 'SEVENTY', 'EIGHTY', 'NINETY'];

  function numberToWords(n) {
    if (n < 20) return ONES_WORDS[n];
    const tens = Math.floor(n / 10);
    const ones = n % 10;
    return ones === 0 ? TENS_WORDS[tens] : TENS_WORDS[tens] + ' ' + ONES_WORDS[ones];
  }

  const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const EXTRA_KEYBOARD_LETTERS = 8;

  const CIPHER_TEMPLATES = [
    (w) => 'FLIP CARD ' + w,
    (w) => 'YOUR NEXT CLUE IS CARD ' + w,
    (w) => 'SEEK OUT CARD ' + w,
    (w) => 'THE ANSWER LIES AT CARD ' + w,
    (w) => 'TURN OVER CARD ' + w + ' NEXT',
    (w) => 'CARD ' + w + ' HOLDS THE TRUTH',
    (w) => 'PROCEED TO CARD ' + w,
    (w) => 'THE TRAIL LEADS TO CARD ' + w,
    (w) => 'GO FIND CARD ' + w,
    (w) => 'CARD ' + w + ' IS YOUR TARGET',
    (w) => 'REVEAL WHAT CARD ' + w + ' HIDES',
    (w) => 'CARD ' + w + ' AWAITS YOU',
  ];

  function makeCipherPuzzle(target) {
    const shift = 1 + Math.floor(Math.random() * 5);
    const template = CIPHER_TEMPLATES[Math.floor(Math.random() * CIPHER_TEMPLATES.length)];
    const phrase = template(numberToWords(target));
    const ciphertext = phrase.split('').map((ch) => {
      if (ch === ' ') return ' ';
      const code = ch.charCodeAt(0) - 65;
      return String.fromCharCode(((code + shift) % 26) + 65);
    }).join('');

    const needed = new Set(phrase.replace(/[^A-Z]/g, '').split(''));
    const extra = shuffle(ALPHABET.filter((l) => !needed.has(l))).slice(0, EXTRA_KEYBOARD_LETTERS);
    const keyboard = [...needed, ...extra].sort();

    return {
      type: 'cipher',
      ciphertext,
      plaintext: phrase,
      shift,
      answer: target,
      solved: false,
      guesses: new Array(ciphertext.length).fill(null),
      keyboard,
      hintsRemaining: PUZZLE_HINT_COUNT,
      reveal: phrase + ' (' + target + ')',
    };
  }

  // A blank-slate cryptogram — no shift/encoding, every letter position
  // just starts blank, and the player has to work out the whole phrase
  // from scratch. The keyboard only offers letters that actually appear
  // (doubling as a checklist), and 2 or 3 random letters start fully
  // revealed as a head start. Kept separate from makeCipherPuzzle() above
  // so the original shift version stays available too.
  function makeCryptogramPuzzle(target) {
    const template = CIPHER_TEMPLATES[Math.floor(Math.random() * CIPHER_TEMPLATES.length)];
    const phrase = template(numberToWords(target));

    const usedLetters = Array.from(new Set(phrase.replace(/[^A-Z]/g, '').split('')));
    const keyboard = usedLetters.slice().sort();

    // Reveal the 2 most frequent letters plus one random third one (picked
    // by letter, not position, so all of that letter's blanks fill in
    // together) — most-used letters give the biggest head start.
    const freq = {};
    phrase.split('').forEach((ch) => { if (ch !== ' ') freq[ch] = (freq[ch] || 0) + 1; });
    const byFrequency = shuffle(usedLetters).sort((a, b) => freq[b] - freq[a]);
    const topTwo = byFrequency.slice(0, 2);
    const remaining = usedLetters.filter((l) => !topTwo.includes(l));
    const thirdLetter = remaining.length ? pickRandom(remaining) : null;
    const prefillLetters = new Set(thirdLetter ? [...topTwo, thirdLetter] : topTwo);
    const guesses = phrase.split('').map((ch) => (ch !== ' ' && prefillLetters.has(ch)) ? ch : null);

    // Each distinct letter gets a random number, shown above its blanks —
    // "LOOK" might display as 1 5 5 9, so a repeated letter is visible as
    // a repeated number without giving away which letter it is. Filling in
    // one 5 fills in every other 5 too, same as the letter-grouping below.
    const shuffledNumbers = shuffle(Array.from({ length: usedLetters.length }, (_, i) => i + 1));
    const numberForLetter = {};
    usedLetters.forEach((letter, i) => { numberForLetter[letter] = shuffledNumbers[i]; });

    return {
      type: 'cryptogram',
      // ciphertext === plaintext (nothing is actually encoded) — that's
      // what keeps the "tap a blank, guess a letter, every matching blank
      // fills in together" grouping mechanic in renderCipherPuzzle working
      // unchanged for this type too.
      ciphertext: phrase,
      plaintext: phrase,
      answer: target,
      solved: false,
      guesses,
      keyboard,
      numberForLetter,
      hintsRemaining: PUZZLE_HINT_COUNT,
      reveal: phrase + ' (' + target + ')',
    };
  }

  // --- Slide puzzle: classic 3x3 sliding tiles (an "8-puzzle") ---

  const SLIDER_SIZE = 3;
  const SLIDER_SOLVED = [1, 2, 3, 4, 5, 6, 7, 8, null];

  function sliderNeighbors(idx) {
    const row = Math.floor(idx / SLIDER_SIZE);
    const col = idx % SLIDER_SIZE;
    const result = [];
    if (row > 0) result.push(idx - SLIDER_SIZE);
    if (row < SLIDER_SIZE - 1) result.push(idx + SLIDER_SIZE);
    if (col > 0) result.push(idx - 1);
    if (col < SLIDER_SIZE - 1) result.push(idx + 1);
    return result;
  }

  // Shuffles by making random *legal* slide moves from the solved state, so
  // the result is always solvable (a plain random shuffle of a sliding
  // puzzle is only solvable half the time).
  function shuffledSliderTiles() {
    const tiles = SLIDER_SOLVED.slice();
    let blankIdx = tiles.indexOf(null);
    let lastIdx = -1;
    const moves = 120 + Math.floor(Math.random() * 60);
    for (let i = 0; i < moves; i++) {
      const options = sliderNeighbors(blankIdx).filter((n) => n !== lastIdx);
      const swapIdx = options[Math.floor(Math.random() * options.length)];
      [tiles[blankIdx], tiles[swapIdx]] = [tiles[swapIdx], tiles[blankIdx]];
      lastIdx = blankIdx;
      blankIdx = swapIdx;
    }
    return tiles;
  }

  function makeSliderPuzzle(target) {
    let tiles = shuffledSliderTiles();
    // 120+ legal moves makes an already-solved result astronomically
    // unlikely, but a puzzle you don't even have to touch isn't a puzzle.
    let guard = 0;
    while (tiles.every((v, i) => v === SLIDER_SOLVED[i]) && guard < 5) {
      tiles = shuffledSliderTiles();
      guard++;
    }
    return {
      type: 'slider',
      tiles,
      answer: target,
      solved: false,
      reveal: 'Flip over card ' + target + '!',
    };
  }

  // --- Swap puzzle: tap any two tiles to swap them, no adjacency needed ---
  // (the sliding puzzle above is kept around and still playable from
  // Mini-Games, but felt too hard for regular play — every tile is free to
  // swap with any other here, and the grid is a size bigger to compensate
  // for how much easier that makes it: 4x4 numbered 1-16, no blank.)

  const SWAP_SIZE = 4;

  function makeSwapPuzzle(target) {
    const solved = Array.from({ length: SWAP_SIZE * SWAP_SIZE }, (_, i) => i + 1);
    let tiles = shuffle(solved);
    let guard = 0;
    while (tiles.every((v, i) => v === solved[i]) && guard < 5) {
      tiles = shuffle(solved);
      guard++;
    }
    return {
      type: 'swap',
      tiles,
      answer: target,
      solved: false,
      hintsRemaining: PUZZLE_HINT_COUNT,
      reveal: 'Flip over card ' + target + '!',
    };
  }

  // --- Pipes puzzle: rotate tiles in place to connect start to end ---

  const PIPES_ROWS = 4;
  const PIPES_COLS = 4;
  const PIPES_UNUSED_MIN = 1;
  const PIPES_UNUSED_MAX = 4;
  const DIR_BIT = { N: 1, E: 2, S: 4, W: 8 };
  const OPPOSITE_DIR = { N: 'S', S: 'N', E: 'W', W: 'E' };
  const DIR_DELTA = { N: [-1, 0], S: [1, 0], E: [0, 1], W: [0, -1] };

  function rotateMask(mask, steps) {
    let m = mask;
    for (let s = 0; s < ((steps % 4) + 4) % 4; s++) {
      let next = 0;
      if (m & DIR_BIT.N) next |= DIR_BIT.E;
      if (m & DIR_BIT.E) next |= DIR_BIT.S;
      if (m & DIR_BIT.S) next |= DIR_BIT.W;
      if (m & DIR_BIT.W) next |= DIR_BIT.N;
      m = next;
    }
    return m;
  }

  function pipesDirBetween(a, b) {
    if (b[0] === a[0] - 1) return 'N';
    if (b[0] === a[0] + 1) return 'S';
    if (b[1] === a[1] - 1) return 'W';
    return 'E';
  }

  // Backtracking self-avoiding walk (a real search, not just a greedy one —
  // a greedy walk traps itself in dead ends long before covering most of a
  // small grid). Keeps track of the longest path found so far, so it can
  // still return a good result even if it can't quite reach targetLen.
  function carvePipesPath(rows, cols, targetLen) {
    let best = [];
    const visited = new Set();
    const path = [];

    function dfs(r, c) {
      path.push([r, c]);
      visited.add(r + ',' + c);
      if (path.length > best.length) best = path.slice();
      if (path.length < targetLen) {
        const options = shuffle(['N', 'S', 'E', 'W'])
          .map((dir) => DIR_DELTA[dir])
          .map(([dr, dc]) => [r + dr, c + dc])
          .filter(([nr, nc]) => nr >= 0 && nr < rows && nc >= 0 && nc < cols && !visited.has(nr + ',' + nc));
        for (const [nr, nc] of options) {
          if (dfs(nr, nc)) return true;
        }
      }
      const reachedTarget = path.length >= targetLen;
      path.pop();
      visited.delete(r + ',' + c);
      return reachedTarget;
    }

    dfs(randomInt(0, rows - 1), randomInt(0, cols - 1));
    return best;
  }

  // BFS from the start tile, following only mutually-aligned openings —
  // used both to check the win condition and to highlight the connected
  // component so far.
  function pipesConnectedSet(tiles) {
    const byPos = {};
    tiles.forEach((t) => { byPos[t.row + ',' + t.col] = t; });
    const start = tiles.find((t) => t.isStart);
    const visited = new Set([start.row + ',' + start.col]);
    const queue = [start];
    while (queue.length) {
      const cur = queue.shift();
      for (const dir of ['N', 'S', 'E', 'W']) {
        if (!(cur.openings & DIR_BIT[dir])) continue;
        const [dr, dc] = DIR_DELTA[dir];
        const nr = cur.row + dr;
        const nc = cur.col + dc;
        const neighbor = byPos[nr + ',' + nc];
        if (!neighbor || !(neighbor.openings & DIR_BIT[OPPOSITE_DIR[dir]])) continue;
        const key = nr + ',' + nc;
        if (visited.has(key)) continue;
        visited.add(key);
        queue.push(neighbor);
      }
    }
    return visited;
  }

  function pipesIsSolved(p) {
    const end = p.tiles.find((t) => t.isEnd);
    return pipesConnectedSet(p.tiles).has(end.row + ',' + end.col);
  }

  function buildPipesAttempt(target) {
    const totalCells = PIPES_ROWS * PIPES_COLS;
    const targetLen = totalCells - randomInt(PIPES_UNUSED_MIN, PIPES_UNUSED_MAX);
    const path = carvePipesPath(PIPES_ROWS, PIPES_COLS, targetLen);

    const pathKeys = new Set(path.map(([r, c]) => r + ',' + c));
    const correctMaskByKey = {};
    path.forEach(([r, c], i) => {
      let mask = 0;
      if (i > 0) mask |= DIR_BIT[pipesDirBetween([r, c], path[i - 1])];
      if (i < path.length - 1) mask |= DIR_BIT[pipesDirBetween([r, c], path[i + 1])];
      correctMaskByKey[r + ',' + c] = mask;
    });

    const tiles = [];
    for (let r = 0; r < PIPES_ROWS; r++) {
      for (let c = 0; c < PIPES_COLS; c++) {
        const key = r + ',' + c;
        const isPath = pathKeys.has(key);
        const isStart = isPath && r === path[0][0] && c === path[0][1];
        const isEnd = isPath && r === path[path.length - 1][0] && c === path[path.length - 1][1];
        let openings;
        let correctMask = null;
        if (isPath) {
          correctMask = correctMaskByKey[key];
          if (isStart || isEnd) {
            // Fixed in place — not rotatable, so it always shows correctly.
            openings = correctMask;
          } else {
            openings = correctMask;
            let attempts = 0;
            while (openings === correctMask && attempts < 6) {
              openings = rotateMask(correctMask, 1 + Math.floor(Math.random() * 3));
              attempts++;
            }
          }
        } else {
          // Unused cell — left visually blank, not part of the puzzle.
          openings = 0;
        }
        tiles.push({ row: r, col: c, isPath, isStart, isEnd, openings, correctMask });
      }
    }

    return {
      type: 'pipes',
      rows: PIPES_ROWS,
      cols: PIPES_COLS,
      tiles,
      answer: target,
      solved: false,
      hintsRemaining: PUZZLE_HINT_COUNT,
      reveal: 'Flip over card ' + target + '!',
    };
  }

  function makePipesPuzzle(target) {
    let puzzle;
    let guard = 0;
    do {
      puzzle = buildPipesAttempt(target);
      guard++;
    } while (pipesIsSolved(puzzle) && guard < 5);
    return puzzle;
  }

  // --- Shapes puzzle: fit polyomino pieces into a rectangle ---

  const SHAPES_ROWS = 5;
  const SHAPES_COLS = 4;
  const SHAPES_TARGET_PIECE_SIZE = 4;
  const SHAPES_PALETTE = ['#4caf7d', '#4c9df0', '#e0a34c', '#e05252', '#b98cf0', '#4cc9c9', '#ffd76a'];

  // 90-degree clockwise rotation of a normalized (min row/col = 0) cell
  // list, re-normalized so the result is always min row/col = 0 too.
  function rotatePieceCells(cells) {
    const maxR = Math.max(...cells.map(([r]) => r));
    const rotated = cells.map(([r, c]) => [c, maxR - r]);
    const minR = Math.min(...rotated.map(([r]) => r));
    const minC = Math.min(...rotated.map(([, c]) => c));
    return rotated.map(([r, c]) => [r - minR, c - minC]);
  }

  // Fills the whole grid with connected pieces, growing each one cell by
  // cell from a random unassigned start toward targetSize (accepting a
  // smaller leftover piece if growth gets boxed in) — every cell always
  // ends up owned by exactly one piece, so the board is always fully
  // coverable by construction, no retry needed.
  function buildShapesTiling(rows, cols, targetSize) {
    const idx = (r, c) => r * cols + c;
    const owner = new Array(rows * cols).fill(-1);
    const pieces = [];

    for (let start = 0; start < rows * cols; start++) {
      if (owner[start] !== -1) continue;
      const sr = Math.floor(start / cols);
      const sc = start % cols;
      const cells = [[sr, sc]];
      owner[start] = pieces.length;
      while (cells.length < targetSize) {
        const candidates = [];
        cells.forEach(([r, c]) => {
          [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(([dr, dc]) => {
            const nr = r + dr;
            const nc = c + dc;
            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && owner[idx(nr, nc)] === -1) {
              candidates.push([nr, nc]);
            }
          });
        });
        if (!candidates.length) break;
        const [nr, nc] = pickRandom(candidates);
        cells.push([nr, nc]);
        owner[idx(nr, nc)] = pieces.length;
      }
      pieces.push(cells);
    }
    return mergeSmallShapePieces(pieces, rows, cols, targetSize);
  }

  // The growth pass above can strand small leftover fragments (even single
  // cells) once neighboring pieces box them in. Folds anything under
  // minSize into a piece it's touching, looping until nothing's left too
  // small — pieces can end up a bit bigger than targetSize as a result,
  // but never smaller, which reads much more like real Tetris pieces.
  function mergeSmallShapePieces(pieces, rows, cols, minSize) {
    const idx = (r, c) => r * cols + c;
    let list = pieces.map((cells) => cells.slice());
    let changed = true;
    while (changed) {
      changed = false;
      const owner = new Array(rows * cols).fill(-1);
      list.forEach((cells, pi) => cells.forEach(([r, c]) => { owner[idx(r, c)] = pi; }));

      for (let pi = 0; pi < list.length; pi++) {
        if (list[pi].length >= minSize) continue;
        let mergeTarget = -1;
        for (const [r, c] of list[pi]) {
          for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
            const nr = r + dr;
            const nc = c + dc;
            if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
            const oi = owner[idx(nr, nc)];
            if (oi !== -1 && oi !== pi) { mergeTarget = oi; break; }
          }
          if (mergeTarget !== -1) break;
        }
        if (mergeTarget === -1) continue;
        list[mergeTarget] = list[mergeTarget].concat(list[pi]);
        list.splice(pi, 1);
        changed = true;
        break;
      }
    }
    return list;
  }

  function shapesCoverage(p) {
    const covered = new Array(p.rows * p.cols).fill(null);
    p.pieces.forEach((piece) => {
      if (!piece.placed) return;
      piece.currentCells.forEach(([dr, dc]) => {
        const r = piece.placedOrigin[0] + dr;
        const c = piece.placedOrigin[1] + dc;
        covered[r * p.cols + c] = piece.id;
      });
    });
    return covered;
  }

  function shapesCanPlace(piece, originR, originC, rows, cols, covered) {
    return piece.currentCells.every(([dr, dc]) => {
      const r = originR + dr;
      const c = originC + dc;
      return r >= 0 && r < rows && c >= 0 && c < cols && covered[r * cols + c] === null;
    });
  }

  function shapesIsSolved(p) {
    return p.pieces.every((piece) => piece.placed);
  }

  function makeShapesPuzzle(target) {
    const rawPieces = buildShapesTiling(SHAPES_ROWS, SHAPES_COLS, SHAPES_TARGET_PIECE_SIZE);
    const pieces = rawPieces.map((cells, i) => {
      const minR = Math.min(...cells.map(([r]) => r));
      const minC = Math.min(...cells.map(([, c]) => c));
      const solvedCells = cells.map(([r, c]) => [r - minR, c - minC]);
      const solvedOrigin = [minR, minC];
      const initialRotation = Math.floor(Math.random() * 4);
      let currentCells = solvedCells;
      for (let s = 0; s < initialRotation; s++) currentCells = rotatePieceCells(currentCells);
      return {
        id: i,
        color: SHAPES_PALETTE[i % SHAPES_PALETTE.length],
        solvedCells,
        solvedOrigin,
        currentCells,
        placed: false,
        placedOrigin: null,
      };
    });

    return {
      type: 'shapes',
      rows: SHAPES_ROWS,
      cols: SHAPES_COLS,
      pieces,
      answer: target,
      solved: false,
      hintsRemaining: PUZZLE_HINT_COUNT,
      reveal: 'Flip over card ' + target + '!',
    };
  }

  // Story Mode picks one of these at random for each puzzle card.
  const PUZZLE_GENERATORS = [
    { make: makeCryptogramPuzzle, hint: '\u{1F9E9} Solve the puzzle to find your next card!' },
    { make: makeSwapPuzzle, hint: '\u{1F522} Solve the number puzzle to find your next card!' },
  ];

  function mediumHintText(target) {
    const useSubtraction = Math.random() < 0.4;
    if (useSubtraction) {
      const b = 1 + Math.floor(Math.random() * 5);
      const a = target + b;
      return 'What is ' + a + ' - ' + b + '?';
    }
    const a = target <= 1 ? 0 : 1 + Math.floor(Math.random() * (target - 1));
    const b = target - a;
    return 'What is ' + a + ' + ' + b + '?';
  }

  function buildHardChain(numbers) {
    const seed1 = 1;
    const seed2 = 2;
    const pool = [seed1, seed2];
    const chain = [seed1, seed2];
    const used = new Set(chain);
    const pairFor = {};
    let last = seed2;
    const maxSteps = 14;

    for (let step = 0; step < maxSteps; step++) {
      const options = [];
      pool.forEach((other) => {
        if (other === last) return;
        const sum = other + last;
        if (sum <= CARD_COUNT && !used.has(sum)) {
          options.push({ other, sum });
        }
      });
      if (options.length === 0) break;
      const pick = options[Math.floor(Math.random() * options.length)];
      pairFor[pick.sum] = [last, pick.other];
      used.add(pick.sum);
      pool.push(pick.sum);
      chain.push(pick.sum);
      last = pick.sum;
    }

    return { chain, pairFor };
  }

  // --- Element refs ---

  const homeScreenEl = document.getElementById('homeScreen');
  const deckGridEl = document.getElementById('deckGrid');
  const gameScreenEl = document.getElementById('gameScreen');
  const gameTitleEl = document.getElementById('gameTitle');
  const homeLinkEl = document.getElementById('homeLink');
  const tableHintBtnEl = document.getElementById('tableHintBtn');
  const debugNextBtnEl = document.getElementById('debugNextBtn');

  const miniGamesScreenEl = document.getElementById('miniGamesScreen');
  const miniGamesGridEl = document.getElementById('miniGamesGrid');
  const miniGamesHomeLinkEl = document.getElementById('miniGamesHomeLink');

  const deckEl = document.getElementById('deck');
  const deckWrapEl = document.getElementById('deckWrap');
  const tableEl = document.getElementById('table');
  const deckCountEl = document.getElementById('deckCount');
  const deckHintEl = document.getElementById('deckHint');

  const livesDisplayEl = document.getElementById('livesDisplay');
  const toastEl = document.getElementById('toast');

  const gameOverOverlayEl = document.getElementById('gameOverOverlay');
  const gameOverRestartEl = document.getElementById('gameOverRestart');

  const winOverlayEl = document.getElementById('winOverlay');
  const winTimeEl = document.getElementById('winTime');
  const winMistakesEl = document.getElementById('winMistakes');
  const winNewBestEl = document.getElementById('winNewBest');
  const winPlayAgainEl = document.getElementById('winPlayAgain');
  const winHomeEl = document.getElementById('winHome');

  const zoomOverlay = document.getElementById('zoomOverlay');
  const zoomCardEl = document.getElementById('zoomCard');
  const zoomNumberEl = document.getElementById('zoomNumber');
  const zoomItemArtEl = document.getElementById('zoomItemArt');
  const zoomMessageEl = document.getElementById('zoomMessage');
  const zoomHintEl = document.getElementById('zoomHint');
  const zoomCloseEl = document.getElementById('zoomClose');
  const zoomPuzzleEl = document.getElementById('zoomPuzzle');
  const cipherGridEl = document.getElementById('cipherGrid');
  const cipherKeyboardEl = document.getElementById('cipherKeyboard');
  const sliderGridEl = document.getElementById('sliderGrid');
  const swapGridEl = document.getElementById('swapGrid');
  const pipesGridEl = document.getElementById('pipesGrid');
  const shapesAreaEl = document.getElementById('shapesArea');
  const shapesGridEl = document.getElementById('shapesGrid');
  const shapesTrayEl = document.getElementById('shapesTray');
  const puzzleInstructionsEl = document.getElementById('puzzleInstructions');
  const puzzleFeedbackEl = document.getElementById('puzzleFeedback');
  const puzzleHintEl = document.getElementById('puzzleHint');
  const puzzleAgainEl = document.getElementById('puzzleAgain');
  const puzzleRevealToggleEl = document.getElementById('puzzleRevealToggle');
  const puzzleRevealEl = document.getElementById('puzzleReveal');

  // --- State ---

  const cardContent = new Map();
  let lives = MAX_LIVES;
  let currentTarget = null;
  let currentMode = null;
  let startTime = 0;
  let mistakes = 0;

  // Story Mode only: the set of card numbers currently safe to flip, and the
  // set already flipped (used to check when a combo card's two ingredients
  // have both been found). Legacy modes keep using currentTarget above.
  let unlockedNumbers = new Set();
  let flippedNumbers = new Set();

  // --- Home screen ---

  function renderHome() {
    const progress = loadProgress();

          <div class="deck-name">${deck.label}</div>

      deckGridEl.appendChild(tile);

  function startDeck(modeId) {

    winOverlayEl.classList.remove('open');

  // --- Lives / feedback ---

  function renderLives() {
    livesDisplayEl.innerHTML = '';
    for (let i = 0; i < MAX_LIVES; i++) {
      const life = document.createElement('span');
      life.className = 'life' + (i < lives ? '' : ' lost');
