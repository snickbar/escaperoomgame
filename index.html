<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Room Card Game</title>
<style>
  :root {
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: #14161c;
    font-family: system-ui, -apple-system, sans-serif;
    color: #cfd3dc;
    padding: 24px 16px 60px;
  }

  h1 {
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    color: #e4e7ee;
    margin: 0 0 12px;
  }

  .lives {
    text-align: center;
    font-size: 26px;
    letter-spacing: 8px;
    margin-bottom: 24px;
  }

  .life {
    display: inline-block;
    transition: transform 0.25s ease, opacity 0.25s ease;
  }

  .life.lost {
    opacity: 0.35;
    transform: scale(0.85);
  }

  .scene {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }

  /* --- Deck pile --- */

  .deck-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    opacity: 1;
    transform: scale(1);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .deck-wrap.gone {
    opacity: 0;
    transform: scale(0.8);
    pointer-events: none;
  }

  .deck {
    position: relative;
    width: 120px;
    height: 168px;
    cursor: pointer;
  }

  .deck[data-empty="true"] {
    cursor: default;
    pointer-events: none;
  }

  .deck-card {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    background: repeating-linear-gradient(135deg, #2b2f3a, #2b2f3a 8px, #262a34 8px, #262a34 16px);
    border: 2px solid #3d4250;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    transition: transform 0.2s ease;
  }

  .deck:hover .deck-card {
    transform: translateY(-4px);
  }

  .deck-caption {
    text-align: center;
    font-size: 13px;
    color: #7a8194;
    line-height: 1.5;
  }

  .deck-caption strong {
    color: #b7bcc9;
    font-size: 15px;
  }

  /* --- Table --- */

  .table {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 16px;
    justify-items: center;
  }

  /* --- Card --- */

  .card {
    width: 110px;
    height: 154px;
    perspective: 1000px;
    cursor: pointer;
    opacity: 0;
    transform: translateY(12px) scale(0.9);
    animation: dealIn 0.4s ease forwards;
  }

  @keyframes dealIn {
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .card.wrong {
    animation: shake 0.4s ease;
    box-shadow: 0 0 0 3px rgba(224, 82, 82, 0.6);
    border-radius: 10px;
  }

  @keyframes shake {
    10%, 90% { transform: translateX(-3px); }
    20%, 80% { transform: translateX(5px); }
    30%, 50%, 70% { transform: translateX(-7px); }
    40%, 60% { transform: translateX(7px); }
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.6s;
    transform-style: preserve-3d;
  }

  .card.flipped .card-inner {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px;
    box-sizing: border-box;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
  }

  .card-back {
    background: linear-gradient(135deg, #2b2f3a, #1a1c22);
    border: 2px solid #3d4250;
  }

  .card-back .card-number {
    font-size: 40px;
    font-weight: 700;
    color: #6c7a96;
  }

  .card-front {
    background: linear-gradient(135deg, #2f6a4f, #1c3f31);
    border: 2px solid #4caf7d;
    transform: rotateY(180deg);
    flex-direction: column;
    gap: 8px;
  }

  .card-front .message {
    font-size: 15px;
    font-weight: 600;
    color: #d8f5e6;
  }

  .card-front .hint {
    font-size: 11px;
    color: #9fd6b8;
  }

  .card-front.story {
    background: linear-gradient(135deg, #6a4f2f, #3f2f1c);
    border-color: #cfa04c;
  }

  .card-front.story .message {
    color: #f5e6d8;
  }

  .card-front.story .hint {
    color: #d6b89f;
  }

  .card-front.win {
    background: linear-gradient(135deg, #6a3f8f, #2f1c4f);
    border-color: #b98cf0;
  }

  .card-front.win .message {
    color: #f0e6f9;
  }

  .card-front.win .hint {
    color: #d6b9f0;
  }

  .hint {
    color: #7a8194;
    font-size: 13px;
  }

  /* --- Zoom overlay --- */

  .zoom-overlay {
    position: fixed;
    inset: 0;
    background: rgba(8, 9, 12, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    padding: 16px;
  }

  .zoom-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .zoom-card {
    position: relative;
    width: min(85vw, 420px);
    aspect-ratio: 110 / 154;
    max-height: 82vh;
    background: linear-gradient(135deg, #2f6a4f, #1c3f31);
    border: 2px solid #4caf7d;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
    padding: 32px;
    transform: scale(0.85) translateY(12px);
    transition: transform 0.25s ease;
  }

  .zoom-overlay.open .zoom-card {
    transform: scale(1) translateY(0);
  }

  .zoom-number {
    font-size: 15px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #9fd6b8;
  }

  .zoom-message {
    font-size: 32px;
    font-weight: 700;
    color: #d8f5e6;
  }

  .zoom-hint {
    font-size: 14px;
    color: #9fd6b8;
  }

  .zoom-card.story {
    background: linear-gradient(135deg, #6a4f2f, #3f2f1c);
    border-color: #cfa04c;
  }

  .zoom-card.story .zoom-number {
    color: #d6b89f;
  }

  .zoom-card.story .zoom-message {
    color: #f5e6d8;
  }

  .zoom-card.story .zoom-hint {
    color: #d6b89f;
  }

  .zoom-card.win {
    background: linear-gradient(135deg, #6a3f8f, #2f1c4f);
    border-color: #b98cf0;
  }

  .zoom-card.win .zoom-number {
    color: #d6b9f0;
  }

  .zoom-card.win .zoom-message {
    color: #f0e6f9;
  }

  .zoom-card.win .zoom-hint {
    color: #d6b9f0;
  }

  .zoom-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: rgba(0, 0, 0, 0.3);
    color: #d8f5e6;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .zoom-close:hover {
    background: rgba(0, 0, 0, 0.5);
  }

  /* --- Game over overlay --- */

  .gameover-overlay {
    position: fixed;
    inset: 0;
    background: rgba(8, 9, 12, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    padding: 16px;
  }

  .gameover-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .gameover-card {
    width: min(90vw, 360px);
    background: linear-gradient(135deg, #6a2f2f, #3f1c1c);
    border: 2px solid #e05252;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    padding: 36px 28px;
    text-align: center;
    transform: scale(0.85);
    transition: transform 0.3s ease;
  }

  .gameover-overlay.open .gameover-card {
    transform: scale(1);
  }

  .gameover-title {
    font-size: 28px;
    font-weight: 700;
    color: #f9d8d8;
    margin-bottom: 10px;
  }

  .gameover-message {
    font-size: 14px;
    color: #e0b9b9;
    margin-bottom: 24px;
  }

  .gameover-button {
    border: none;
    border-radius: 8px;
    background: #e05252;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 24px;
    cursor: pointer;
  }

  .gameover-button:hover {
    background: #ea6868;
  }
</style>
</head>
<body>

<h1>Escape Room Card Game</h1>

<div class="lives" id="livesDisplay"></div>

<div class="scene">
  <div class="deck-wrap" id="deckWrap">
    <div class="deck" id="deck">
      <div class="deck-card" style="transform: translate(3px, 3px) rotate(-2deg);"></div>
      <div class="deck-card" style="transform: translate(-2px, 1px) rotate(1.5deg);"></div>
      <div class="deck-card" style="transform: translate(1px, -2px) rotate(-1deg);"></div>
      <div class="deck-card"></div>
    </div>
    <div class="deck-caption">
      <strong id="deckCount">12</strong> cards in deck<br>
      <span id="deckHint">Click the deck to deal</span>
    </div>
  </div>

  <div class="table" id="table"></div>
</div>

<div class="zoom-overlay" id="zoomOverlay">
  <div class="zoom-card" id="zoomCard">
    <button class="zoom-close" id="zoomClose" aria-label="Close">&times;</button>
    <div class="zoom-number" id="zoomNumber"></div>
    <div class="zoom-message" id="zoomMessage"></div>
    <div class="zoom-hint" id="zoomHint"></div>
  </div>
</div>

<div class="gameover-overlay" id="gameOverOverlay">
  <div class="gameover-card">
    <div class="gameover-title">&#128128; Game Over</div>
    <div class="gameover-message">You ran out of lives. Give it another try!</div>
    <button class="gameover-button" id="gameOverRestart">Start Again</button>
  </div>
</div>

<script>
  const CARD_COUNT = 12;

  function orderedNumbers(count) {
    return Array.from({ length: count }, (_, i) => i + 1);
  }

  const STORY_NUMBER = 1;

  const deckEl = document.getElementById('deck');
  const deckWrapEl = document.getElementById('deckWrap');
  const tableEl = document.getElementById('table');
  const deckCountEl = document.getElementById('deckCount');
  const deckHintEl = document.getElementById('deckHint');

  const cardContent = new Map();
  const MAX_LIVES = 3;
  let lives = MAX_LIVES;
  let currentTarget = null;

  const livesDisplayEl = document.getElementById('livesDisplay');
  const gameOverOverlayEl = document.getElementById('gameOverOverlay');
  const gameOverRestartEl = document.getElementById('gameOverRestart');

  function renderLives() {
    livesDisplayEl.innerHTML = '';
    for (let i = 0; i < MAX_LIVES; i++) {
      const life = document.createElement('span');
      life.className = 'life' + (i < lives ? '' : ' lost');
      life.textContent = '❤️';
      livesDisplayEl.appendChild(life);
    }
  }

  function triggerWrongFeedback(card) {
    card.classList.remove('wrong');
    void card.offsetWidth;
    card.classList.add('wrong');
  }

  function loseLife() {
    lives--;
    renderLives();
    if (lives <= 0) {
      gameOverOverlayEl.classList.add('open');
    }
  }

  gameOverRestartEl.addEventListener('click', () => {
    location.reload();
  });

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildCardContent(numbers) {
    const rest = shuffle(numbers.filter((n) => n !== STORY_NUMBER));
    const chain = [STORY_NUMBER, ...rest];

    chain.forEach((num, i) => {
      const isStory = i === 0;
      const isWin = i === chain.length - 1;
      const next = isWin ? null : chain[i + 1];
      let message;
      let hint;

      if (isStory) {
        message = 'Help Lucy find her lost dog!';
        hint = 'Flip over card ' + next + '!';
      } else if (isWin) {
        message = '\u{1F389} You escaped!';
        hint = 'The End';
      } else {
        message = '✓ Nicely done!';
        hint = 'Flip over card ' + next + '!';
      }

      cardContent.set(num, { isStory, isWin, message, hint, next });
    });

    currentTarget = cardContent.get(STORY_NUMBER).next;
  }

  function dealCards() {
    const numbers = orderedNumbers(CARD_COUNT);
    buildCardContent(numbers);

    numbers.forEach((num, index) => {
      const content = cardContent.get(num);
      const card = document.createElement('div');
      card.className = 'card' + (content.isStory ? ' flipped' : '');
      card.style.animationDelay = (index * 0.06) + 's';
      card.dataset.number = num;

      card.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-back">
            <div class="card-number">${num}</div>
          </div>
          <div class="card-face card-front${content.isStory ? ' story' : content.isWin ? ' win' : ''}">
            <div class="message">${content.message}</div>
            <div class="hint">${content.hint}</div>
          </div>
        </div>
      `;

      card.addEventListener('click', () => {
        if (card.classList.contains('flipped')) {
          openZoom(num);
          return;
        }
        if (num !== currentTarget) {
          triggerWrongFeedback(card);
          loseLife();
          return;
        }
        card.classList.add('flipped');
        currentTarget = content.next;
      });
      tableEl.appendChild(card);
    });

    deckEl.dataset.empty = 'true';
    deckCountEl.textContent = '0';
    deckHintEl.textContent = 'All cards dealt';

    deckWrapEl.classList.add('gone');
    deckWrapEl.addEventListener('transitionend', () => {
      deckWrapEl.style.display = 'none';
    }, { once: true });

    lives = MAX_LIVES;
    renderLives();
  }

  renderLives();

  deckEl.addEventListener('click', dealCards);

  const zoomOverlay = document.getElementById('zoomOverlay');
  const zoomCardEl = document.getElementById('zoomCard');
  const zoomNumberEl = document.getElementById('zoomNumber');
  const zoomMessageEl = document.getElementById('zoomMessage');
  const zoomHintEl = document.getElementById('zoomHint');
  const zoomCloseEl = document.getElementById('zoomClose');

  function openZoom(num) {
    const content = cardContent.get(num);
    zoomCardEl.classList.toggle('story', content.isStory);
    zoomCardEl.classList.toggle('win', content.isWin);
    zoomNumberEl.textContent = 'Card ' + num;
    zoomMessageEl.textContent = content.message;
    zoomHintEl.textContent = content.hint;
    zoomOverlay.classList.add('open');
  }

  function closeZoom() {
    zoomOverlay.classList.remove('open');
  }

  zoomCloseEl.addEventListener('click', closeZoom);
  zoomOverlay.addEventListener('click', (e) => {
    if (e.target === zoomOverlay) closeZoom();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeZoom();
  });
</script>

</body>
</html>
