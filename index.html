  let toastTimeout;
  function showToast(message, duration) {
    toastEl.textContent = message;
    toastEl.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
      toastEl.classList.remove('show');
    }, duration || 1800);
  }

  // Dev/QA aid: shows exactly what the game currently considers a correct
  // flip, so a report like "I couldn't find the card I needed" can be
  // checked against the actual state instead of guessed at.
  debugNextBtnEl.addEventListener('click', () => {
    if (!currentMode) {
      showToast('Deal a deck first.');
      return;
    }
    if (currentMode === 'story') {
      const nums = Array.from(unlockedNumbers).sort((a, b) => a - b);
      showToast(nums.length ? ('Unlocked now: ' + nums.join(', ')) : 'Nothing unlocked yet — deal the deck.', 4000);
    } else {
      showToast(currentTarget != null ? ('Next card: ' + currentTarget) : 'No target — deal the deck or you already won.', 4000);
    }
  });

  // Returns true if `target` is currently unlocked, but every card that
  // unlocked it is a puzzle the player hasn't solved yet -- highlighting it
  // would just hand over the puzzle's answer instead of helping them find
  // a card they already legitimately know about.
  function isTargetPuzzleGated(target) {
    if (target == null) return false;
    let hasLegitimateSource = false;
    let hasAnySource = false;
    cardContent.forEach((c, sourceNum) => {
      const unlocksThis = currentMode === 'story'
        ? (c.unlocks && c.unlocks.includes(target))
        : (c.next === target);
      if (!unlocksThis) return;
      const sourceEl = document.querySelector('.card[data-number="' + sourceNum + '"]');
      if (!sourceEl || !sourceEl.classList.contains('flipped')) return;
      hasAnySource = true;
      if (!(c.puzzle && !c.puzzle.solved)) hasLegitimateSource = true;
    });
    return hasAnySource && !hasLegitimateSource;
  }

  function clearTableHintHighlight() {
    document.querySelectorAll('.card.hinted').forEach((el) => el.classList.remove('hinted'));
  }

  function highlightCardOnTable(num) {
    clearTableHintHighlight();
    const cardEl = document.querySelector('.card[data-number="' + num + '"]');
    if (!cardEl) return;
    cardEl.classList.add('hinted');
    cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // Player-facing hint (unlike the debug button above): highlights one
  // already-unlocked card on the table so it's easy to spot among a big
  // spread, but refuses when the only unlocked option is still locked
  // behind an unsolved puzzle — open that puzzle instead, where its own
  // Hint button can help solve it.
  tableHintBtnEl.addEventListener('click', () => {
    if (!currentMode) {
      showToast('Deal a deck first.');
      return;
    }
    const rawCandidates = currentMode === 'story'
      ? Array.from(unlockedNumbers)
      : (currentTarget != null ? [currentTarget] : []);
    const candidates = rawCandidates.filter((n) => !isTargetPuzzleGated(n));
    if (!candidates.length) {
      showToast(rawCandidates.length
        ? '\u{1F4A1} No hints available — solve the open puzzle first!'
        : 'Nothing to hint yet.');
      return;
    }
    highlightCardOnTable(pickRandom(candidates));
    showToast('\u{1F4A1} Hint: watch for the glowing card!');
  });

  function triggerWrongFeedback(card) {
    card.classList.remove('wrong');
    void card.offsetWidth;
    card.classList.add('wrong');
    clearTimeout(card._wrongTimeout);
    card._wrongTimeout = setTimeout(() => {
      card.classList.remove('wrong');
    }, 900);
  }

  function triggerCorrectFeedback(card) {
    card.classList.remove('correct');
    void card.offsetWidth;
    card.classList.add('correct');
    clearTimeout(card._correctTimeout);
    card._correctTimeout = setTimeout(() => {
      card.classList.remove('correct');
    }, 900);
  }

  let audioCtx = null;
  function playCorrectSound() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!audioCtx) audioCtx = new Ctx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      // A quick two-note ascending "ding" — no audio asset needed.
      [523.25, 783.99].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        const start = now + i * 0.08;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.25, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.22);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.24);
      });
    } catch (e) {
      // Audio is a nice-to-have; never let it break the game.
    }
  }

  function loseLife() {
    lives--;
    mistakes++;
    renderLives();
    if (lives <= 0) {
      showToast('Sorry, game over! Please try again.');
      setTimeout(() => {
        gameOverOverlayEl.classList.add('open');
      }, 500);
    } else {
      showToast('Incorrect, try again!');
    }
  }

  gameOverRestartEl.addEventListener('click', () => {
    gameOverOverlayEl.classList.remove('open');
    performDeal();
  });

  // --- Card content per mode ---

  function trapContent() {
    return {
      isStory: false, isWin: false, isSeed: false,
      next: null, message: '', hint: '', backItem: null, puzzle: null,
      unlocks: [], requires: null,
    };
  }

  function buildCardContent(mode, numbers) {
    cardContent.clear();

    if (mode === 'hard') {
      buildHardCardContent(numbers);
      return;
    }

    const others = shuffle(numbers.filter((n) => n !== STORY_NUMBER)).slice(0, CHAIN_LENGTH - 1);
    const chain = [STORY_NUMBER, ...others];
    const chainSet = new Set(chain);

    chain.forEach((num, i) => {
      const isStory = i === 0;
      const isWin = i === chain.length - 1;
      const next = isWin ? null : chain[i + 1];

      let hint;
      let puzzle = null;
      if (isWin) {
        hint = 'The End';
      } else if (mode === 'easy') {
        puzzle = makeCipherPuzzle(next);
        hint = '\u{1F510} Solve the cipher to find your next card!';
      } else {
        hint = mediumHintText(next);
      }

      let message;
      if (isStory) {
        message = DECKS[mode].story;
      } else if (isWin) {
        message = '\u{1F389} You escaped!';
      } else {
        message = '✓ Nicely done!';
      }

      cardContent.set(num, { isStory, isWin, isSeed: isStory, next, message, hint, backItem: null, puzzle });
    });

    numbers.forEach((num) => {
      if (!chainSet.has(num)) cardContent.set(num, trapContent());
    });

    currentTarget = cardContent.get(STORY_NUMBER).next;
  }

  // Walks the combine chain and hands out items to each card: where two
  // freshly-unassigned parent cards combine, they get a matching illustrated
  // "A + B = C" triad; everywhere else falls back to a plain emoji item.
  function assignHardItems(chain, pairFor) {
    const itemForNumber = {};
    const comboPool = shuffle(COMBO_SETS.slice());
    const emojiPool = shuffle(ITEMS.slice());

    function nextEmoji() {
      if (emojiPool.length === 0) emojiPool.push(...shuffle(ITEMS.slice()));
      return emojiPool.pop();
    }

    for (let i = 2; i < chain.length; i++) {
      const sum = chain[i];
      const [a, b] = pairFor[sum];
      if (!itemForNumber[a] && !itemForNumber[b] && comboPool.length > 0) {
        const combo = comboPool.pop();
        itemForNumber[a] = combo.a;
        itemForNumber[b] = combo.b;
        itemForNumber[sum] = combo.c;
      } else {
        if (!itemForNumber[a]) itemForNumber[a] = nextEmoji();
        if (!itemForNumber[b]) itemForNumber[b] = nextEmoji();
        if (!itemForNumber[sum]) itemForNumber[sum] = nextEmoji();
      }
    }
    chain.forEach((num) => {
      if (!itemForNumber[num]) itemForNumber[num] = nextEmoji();
    });
    return itemForNumber;
  }

  function buildHardCardContent(numbers) {
    const { chain, pairFor } = buildHardChain(numbers);
    const chainSet = new Set(chain);
    const itemForNumber = assignHardItems(chain, pairFor);

    chain.forEach((num, i) => {
      const isStory = i === 0;
      const isSeed = i < 2;
      const isWin = i === chain.length - 1;
      const next = isWin ? null : chain[i + 1];

      let hint = '';
      if (isWin) {
        hint = 'The End';
      } else if (i >= 1) {
        const [a, b] = pairFor[next];
        const aItem = itemForNumber[a];
        const bItem = itemForNumber[b];
        hint = 'Add ' + itemVisual(aItem) + ' ' + aItem.name + ' and ' + itemVisual(bItem) + ' ' + bItem.name +
          ' to find your next card!';
      }

      let message;
      if (isStory) {
        message = DECKS.hard.story;
      } else if (isWin) {
        message = '\u{1F389} You escaped!';
      } else {
        message = '✓ Item found!';
      }

      cardContent.set(num, { isStory, isWin, isSeed, next, message, hint, backItem: itemForNumber[num], puzzle: null });
    });

    numbers.forEach((num) => {
      if (!chainSet.has(num)) cardContent.set(num, trapContent());
    });

    currentTarget = chain.length > 2 ? chain[2] : null;
  }

  // --- Story Mode: branching chain builder ---
  //
  // Builds an abstract graph of `usedCount` nodes (ids 0..usedCount-1,
  // created in the order below), independent of which real numbers end up
  // on the cards — buildStoryCardContent() maps ids to numbers afterward.
  //
  // Node kinds:
  //   story  — flavor text, explicitly unlocks 1-2 further nodes
  //   puzzle — a cipher; solving it reveals exactly 1 further node
  //   object — an item; unlocks nothing itself, just waits to be paired
  //   combo  — requires its two object nodes both flipped before it
  //            unlocks; once flipped it continues the chain like a story
  //            node
  //   win    — the escape card; every dead-end node unlocks it
  //
  // Nodes below MIN_BRANCH_DEPTH always get exactly one child (a forced
  // linear "spine" out of the root) so a game can never fan out — and
  // therefore can never dead-end — in the first couple of hops.
  const MIN_BRANCH_DEPTH = 2;

  function buildStoryGraph(usedCount) {
    const nodes = [];
    function makeNode(kind, depth) {
      const node = { id: nodes.length, kind, depth, unlocks: [], requires: null, isStart: false, isWin: false };
      nodes.push(node);
      return node;
    }

    const root = makeNode('story', 0);
    root.isStart = true;

    // Reserve one slot for root and one for the win card that closes every
    // dead-end branch, so the graph always lands on exactly usedCount nodes.
    let budget = usedCount - 2;
    const queue = [root];
    let comboGuaranteed = false;

    while (queue.length && budget > 0) {
      const node = queue.shift();
      // A puzzle only ever reveals a single answer, so it can't branch or
      // kick off a combo — it always gets exactly one child.
      const isPuzzle = node.kind === 'puzzle';
      const canBranch = node.depth >= MIN_BRANCH_DEPTH;
      const canCombo = !isPuzzle && canBranch && budget >= 3;
      // The first node eligible to branch at all is always an object pair,
      // so a combo (and therefore its artwork) is guaranteed every game —
      // every table has at least ~22 budget to spare at this point, so
      // this can't fail to find an eligible node before budget runs out.
      const wantsCombo = canCombo && (!comboGuaranteed || Math.random() < 0.28);

      if (wantsCombo) {
        comboGuaranteed = true;
        const objA = makeNode('object', node.depth + 1);
        const objB = makeNode('object', node.depth + 1);
        const combo = makeNode('combo', node.depth + 1);
        combo.requires = [objA.id, objB.id];
        node.unlocks.push(objA.id, objB.id);
        queue.push(combo);
        budget -= 3;
      } else {
        const wantsTwo = !isPuzzle && canBranch && budget >= 2 && Math.random() < 0.35;
        const childCount = wantsTwo ? 2 : 1;
        for (let i = 0; i < childCount && budget > 0; i++) {
          const kind = Math.random() < 0.55 ? 'story' : 'puzzle';
          const child = makeNode(kind, node.depth + 1);
          node.unlocks.push(child.id);
          queue.push(child);
          budget -= 1;
        }
      }
    }

    const win = makeNode('win', 0);
    win.isWin = true;
    nodes.forEach((n) => {
      if (n === win || n.kind === 'object') return;
      if (n.unlocks.length === 0) n.unlocks.push(win.id);
    });

    // Safety net: with 55% story / 45% puzzle odds this is astronomically
    // likely already, but guarantee at least one puzzle exists regardless.
    if (!nodes.some((n) => n.kind === 'puzzle')) {
      const candidate = nodes.find((n) => n.kind === 'story' && !n.isStart);
      if (candidate) candidate.kind = 'puzzle';
    }

    return nodes;
  }

  // Hands each combo's two (always-fresh) ingredient nodes a matching
  // illustrated triad when artwork remains, otherwise a plain emoji item.
  function assignStoryItems(nodes) {
    const itemForId = {};
    const comboPool = shuffle(COMBO_SETS.slice());
    const emojiPool = shuffle(ITEMS.slice());

    function nextEmoji() {
      if (emojiPool.length === 0) emojiPool.push(...shuffle(ITEMS.slice()));
      return emojiPool.pop();
    }

    nodes.forEach((n) => {
      if (n.kind !== 'combo') return;
      const [aId, bId] = n.requires;
      if (comboPool.length > 0) {
        const combo = comboPool.pop();
        itemForId[aId] = combo.a;
        itemForId[bId] = combo.b;
        itemForId[n.id] = combo.c;
      } else {
        itemForId[aId] = nextEmoji();
        itemForId[bId] = nextEmoji();
        itemForId[n.id] = nextEmoji();
      }
    });

    return itemForId;
  }

  function describeUnlocks(nums) {
    if (!nums || nums.length === 0) return '';
    if (nums.length === 1) return 'Flip over card ' + nums[0] + '!';
    return 'Flip over cards ' + nums.join(' and ') + '!';
  }

  // Assigns every graph node a real card number, and returns every number
  // used on the table (graph nodes + traps) for the caller to render.
  //
  // Combo numbers are a genuine sum of their two ingredient numbers — like
  // Hard Mode, the player computes it themselves — so ingredients get
  // handed out from a reserved, provably collision-free scheme instead of
  // plain random draws:
  //   - The top `2 * comboCount` values of 1..NUMBER_MAX are reserved for
  //     ingredients, laid out as consecutive pairs (base+1,base+2),
  //     (base+3,base+4), ... — so combo i's sum is always exactly 4 more
  //     than combo i-1's, guaranteeing every combo's sum is distinct.
  //   - The smallest possible sum is still greater than NUMBER_MAX, so a
  //     combo's sum can never collide with any non-combo card's number.
  //   - Which combo gets which pair (and which ingredient gets the lower
  //     vs. higher half) is still randomized per game.
  //   - Everything else (root/story/puzzle/win + traps) draws from
  //     whatever's left of 1..base.
  function buildStoryCardContent(tableSize, usedCount) {
    cardContent.clear();

    const nodes = buildStoryGraph(usedCount);
    const comboNodes = nodes.filter((n) => n.kind === 'combo');
    const otherNodes = nodes.filter((n) => n.kind !== 'combo' && n.kind !== 'object');
    const base = STORY_MODE_NUMBER_MAX - comboNodes.length * 2;

    const numberForId = {};
    const pairOrder = shuffle(comboNodes.map((_, i) => i));
    comboNodes.forEach((combo, i) => {
      const slot = pairOrder[i];
      const a = base + 1 + slot * 2;
      const b = a + 1;
      const [aId, bId] = combo.requires;
      if (Math.random() < 0.5) { numberForId[aId] = a; numberForId[bId] = b; }
      else { numberForId[aId] = b; numberForId[bId] = a; }
      numberForId[combo.id] = a + b;
    });

    const lowPool = shuffle(Array.from({ length: base }, (_, i) => i + 1));
    let lowIdx = 0;
    otherNodes.forEach((n) => { numberForId[n.id] = lowPool[lowIdx++]; });
    const trapCount = tableSize - usedCount;
    const trapNumbers = lowPool.slice(lowIdx, lowIdx + trapCount);

    const itemForId = assignStoryItems(nodes);

    nodes.forEach((n) => {
      const num = numberForId[n.id];
      const unlockNums = n.unlocks.map((id) => numberForId[id]);
      const requiresNums = n.requires ? n.requires.map((id) => numberForId[id]) : null;
      const backItem = itemForId[n.id] || null;

      let message = '';
      let hint = '';
      let puzzle = null;

      let hasBeat = false;

      if (n.isStart) {
        message = pickRandom(STORY_INTROS);
        hint = describeUnlocks(unlockNums);
      } else if (n.isWin) {
        message = '\u{1F389} You escaped!';
        hint = 'The End';
      } else if (n.kind === 'puzzle') {
        const generator = pickRandom(PUZZLE_GENERATORS);
        puzzle = generator.make(unlockNums[0]);
        hint = generator.hint;
      } else if (n.kind === 'object') {
        // No "combine with ___" pointer — the player has to notice the
        // pairing themselves from the artwork.
        hint = '';
      } else if (n.kind === 'combo') {
        // The payoff card: confirms what got made and, like a story card,
        // still has to say what to flip next — losing this was the bug.
        message = pickRandom(COMBO_PRAISE) + ' ' + (backItem ? backItem.name : 'item') + '!';
        hint = describeUnlocks(unlockNums);
        hasBeat = true;
      } else {
        // A plain story beat — never just the bare "flip over card X".
        message = pickRandom(STORY_BEATS);
        hint = describeUnlocks(unlockNums);
        hasBeat = true;
      }

      cardContent.set(num, {
        isStory: n.isStart, isWin: n.isWin, isSeed: n.isStart, hasBeat,
        unlocks: unlockNums, requires: requiresNums,
        message, hint, backItem, puzzle,
      });
    });

    trapNumbers.forEach((num) => cardContent.set(num, trapContent()));

    const rootNode = nodes.find((n) => n.isStart);
    const rootNumber = numberForId[rootNode.id];
    flippedNumbers = new Set([rootNumber]);
    unlockedNumbers = new Set(cardContent.get(rootNumber).unlocks);

    return nodes.map((n) => numberForId[n.id]).concat(trapNumbers);
  }

  // Marks a Story Mode card as flipped, applies whatever it explicitly
  // unlocks, then re-checks every pending combo in case this was the second
  // of its two required ingredients.
  function flipStoryCard(num, content) {
    unlockedNumbers.delete(num);
    flippedNumbers.add(num);
    content.unlocks.forEach((n) => unlockedNumbers.add(n));
    cardContent.forEach((c, cardNum) => {
      if (!c.requires || flippedNumbers.has(cardNum)) return;
      const [a, b] = c.requires;
      if (flippedNumbers.has(a) && flippedNumbers.has(b)) {
        unlockedNumbers.add(cardNum);
      }
    });
  }

  function tableSizeForMode(mode) {
    // Story Mode's table size isn't decided until it's dealt, so the
    // pre-deal preview shows the range rather than a committed number.
    return mode === 'story' ? (STORY_MODE_TABLE_SIZE_MIN + '–' + STORY_MODE_TABLE_SIZE_MAX) : CARD_COUNT;
  }

  function dealCards() {
    if (deckEl.dataset.empty === 'true') return;
    performDeal();
  }

  function performDeal() {
    tableEl.innerHTML = '';
    winOverlayEl.classList.remove('open');
    gameOverOverlayEl.classList.remove('open');
    zoomOverlay.classList.remove('open');
    mistakes = 0;
    let numbers;
    if (currentMode === 'story') {
      // Table size and the used/trap split both vary every deal, including
      // on "Play Again" — no two games have the same shape.
      const tableSize = randomInt(STORY_MODE_TABLE_SIZE_MIN, STORY_MODE_TABLE_SIZE_MAX);
      const usedRatio = STORY_MODE_USED_RATIO_MIN + Math.random() * (STORY_MODE_USED_RATIO_MAX - STORY_MODE_USED_RATIO_MIN);
      const usedCount = Math.round(tableSize * usedRatio);
      numbers = buildStoryCardContent(tableSize, usedCount);
      // Card values stay random, but lay the table out in ascending order
      // so a "flip over card 47" hint is easy to scan for instead of a hunt.
      numbers = numbers.slice().sort((a, b) => a - b);
    } else {
      numbers = orderedNumbers(CARD_COUNT);
      buildCardContent(currentMode, numbers);
    }

    numbers.forEach((num, index) => {
      const content = cardContent.get(num);
      const card = document.createElement('div');
      card.className = 'card' + (content.isSeed ? ' flipped' : '');
      card.style.animationDelay = (index * 0.06) + 's';
      card.dataset.number = num;

      const hasArt = !!content.backItem;
      const isCombo = !!content.requires;
      const iconInner = hasArt ? `<div class="front-icon">${itemVisual(content.backItem)}</div>` : '';
      // The story intro, the win card, a combo's "you made it!" line, and
      // every plain story beat all carry real flavor text — the generic
      // "Nicely done!" on every legacy-mode card was just clutter that
      // pushed the hint off the card, so that one's still suppressed.
      const messageInner = (content.isStory || content.isWin || content.hasBeat) ? `<div class="message">${content.message}</div>` : '';
      // Ingredient (object) cards are just the picture with no hint text —
      // the player has to notice the pairing themselves. Everything else,
      // including a combo's own "flip over card X" payoff, still needs it.
      const hintInner = (hasArt && !isCombo) ? '' : `<div class="hint">${content.hint}</div>`;

      card.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-back">
            <div class="card-number">${num}</div>
          </div>
          <div class="card-face card-front${content.isStory ? ' story' : content.isWin ? ' win' : ''}${hasArt ? ' has-art' : ''}">
            <div class="front-number">#${num}</div>
            ${iconInner}
            ${messageInner}
            ${hintInner}
          </div>
        </div>
        <div class="wrong-mark">&#10005;</div>
        <div class="correct-mark">&#10003;</div>
      `;

      card.addEventListener('click', () => {
        clearTableHintHighlight();
        if (card.classList.contains('flipped')) {
          openZoom(num);
          return;
        }
        const isCorrect = currentMode === 'story' ? unlockedNumbers.has(num) : num === currentTarget;
        if (!isCorrect) {
          triggerWrongFeedback(card);
          loseLife();
          return;
        }
        triggerCorrectFeedback(card);
        playCorrectSound();
        card.classList.add('flipped');
        if (currentMode === 'story') {
          flipStoryCard(num, content);
        } else {
          currentTarget = content.next;
        }
        if (content.isWin) {
          setTimeout(triggerWin, 700);
        }
      });
      tableEl.appendChild(card);
    });

    deckEl.dataset.empty = 'true';
    deckCountEl.textContent = '0';
    deckHintEl.textContent = 'All cards dealt';

    deckWrapEl.classList.remove('gone');
    deckWrapEl.style.display = '';
    deckWrapEl.classList.add('gone');
    deckWrapEl.addEventListener('transitionend', () => {
      deckWrapEl.style.display = 'none';
    }, { once: true });

    lives = MAX_LIVES;
    renderLives();
    startTime = Date.now();
  }

  deckEl.addEventListener('click', dealCards);

  // --- Win flow ---

  function triggerWin() {
    const elapsedMs = Date.now() - startTime;
    const progress = loadProgress();
    const prev = progress[currentMode] || {};
    const isNewBest = !prev.bestTimeMs || elapsedMs < prev.bestTimeMs;
    progress[currentMode] = {
      completed: true,
      bestTimeMs: isNewBest ? elapsedMs : prev.bestTimeMs,
    };
    saveProgress(progress);

    winTimeEl.textContent = formatTime(elapsedMs);
    winMistakesEl.textContent = mistakes === 0
      ? 'None — perfect run!'
      : mistakes + (mistakes === 1 ? ' mistake' : ' mistakes');
    winNewBestEl.hidden = !isNewBest;
    winOverlayEl.classList.add('open');
  }

  winPlayAgainEl.addEventListener('click', () => {
    winOverlayEl.classList.remove('open');
    performDeal();
  });

  winHomeEl.addEventListener('click', () => {
    winOverlayEl.classList.remove('open');
    goHome();
  });

  // --- Zoom overlay ---

  function openZoom(num) {
    const content = cardContent.get(num);
    zoomCardEl.classList.toggle('story', content.isStory);
    zoomCardEl.classList.toggle('win', content.isWin);
    zoomNumberEl.textContent = 'Card ' + num;
    if (content.backItem) {
      zoomItemArtEl.innerHTML = itemVisual(content.backItem);
      zoomItemArtEl.hidden = false;
    } else {
      zoomItemArtEl.hidden = true;
      zoomItemArtEl.innerHTML = '';
    }
    zoomMessageEl.textContent = content.message;

    const showPuzzle = content.puzzle && !content.puzzle.solved;
    zoomCardEl.classList.toggle('has-puzzle', showPuzzle);
    zoomHintEl.hidden = showPuzzle;
    zoomPuzzleEl.hidden = !showPuzzle;

    if (showPuzzle) {
      renderPuzzle(content, num);
    } else {
      zoomHintEl.innerHTML = content.puzzle ? ('Flip over card ' + content.puzzle.answer + '!') : content.hint;
    }

    zoomOverlay.classList.add('open');
  }

  // Dispatches to the right puzzle-type renderer. Each renderer owns its
  // own grid container and hides the others.
  function renderPuzzle(content, num, opts) {
    if (content.puzzle.type === 'slider') {
      renderSliderPuzzle(content, num, opts);
    } else if (content.puzzle.type === 'swap') {
      renderSwapPuzzle(content, num, opts);
    } else if (content.puzzle.type === 'pipes') {
      renderPipesPuzzle(content, num, opts);
    } else if (content.puzzle.type === 'shapes') {
      renderShapesPuzzle(content, num, opts);
    } else {
      renderCipherPuzzle(content, num, opts);
    }
  }

  function renderCipherPuzzle(content, num, opts) {
    opts = opts || {};
    const isTest = !!opts.isTest;
    const p = content.puzzle;

    cipherGridEl.hidden = false;
    cipherKeyboardEl.hidden = false;
    sliderGridEl.hidden = true;
    swapGridEl.hidden = true;
    pipesGridEl.hidden = true;
    shapesAreaEl.hidden = true;

    puzzleInstructionsEl.textContent = p.type === 'cryptogram'
      ? 'Figure out the hidden phrase! Tap a blank, then tap a letter — matching letters fill in together.'
      : 'Each letter is shifted forward by ' + p.shift +
        ' in the alphabet. Tap a blank, then tap a letter — matching letters fill in too.';
    puzzleFeedbackEl.textContent = '';
    puzzleFeedbackEl.className = 'puzzle-feedback';
    puzzleAgainEl.hidden = true;
    puzzleRevealEl.hidden = true;
    puzzleRevealToggleEl.textContent = '\u{1F50D} Show Answer (dev)';
    puzzleRevealToggleEl.onclick = () => {
      const showing = !puzzleRevealEl.hidden;
      puzzleRevealEl.hidden = showing;
      puzzleRevealToggleEl.textContent = showing
        ? '\u{1F50D} Show Answer (dev)'
        : '\u{1F648} Hide Answer';
      puzzleRevealEl.textContent = 'Decoded: ' + p.reveal;
    };

    puzzleHintEl.hidden = false;
    updateHintButton();
    puzzleHintEl.onclick = useHint;

    let activeIndex = -1;
    let hintedIndices = new Set();
    for (let i = 0; i < p.ciphertext.length; i++) {
      if (p.ciphertext[i] !== ' ' && !p.guesses[i]) {
        activeIndex = i;
        break;
      }
    }

    function advanceActive() {
      for (let i = activeIndex + 1; i < p.ciphertext.length; i++) {
        if (p.ciphertext[i] !== ' ' && !p.guesses[i]) {
          activeIndex = i;
          return;
        }
      }
      for (let i = 0; i < p.ciphertext.length; i++) {
        if (p.ciphertext[i] !== ' ' && !p.guesses[i]) {
          activeIndex = i;
          return;
        }
      }
      activeIndex = -1;
    }

    function updateHintButton() {
      puzzleHintEl.textContent = '\u{1F4A1} Hint (' + p.hintsRemaining + ')';
      puzzleHintEl.disabled = p.solved || p.hintsRemaining <= 0;
    }

    // Reveals one whole letter (every instance, same as a normal correct
    // guess) — prefers a letter that's still fully blank; if every letter
    // has at least been attempted, fixes one that's currently wrong.
    function useHint() {
      if (p.solved || p.hintsRemaining <= 0) return;
      const blankLetters = p.keyboard.filter((l) =>
        p.ciphertext.split('').some((ch, i) => ch === l && !p.guesses[i]));
      const wrongLetters = p.keyboard.filter((l) =>
        p.ciphertext.split('').some((ch, i) => ch === l && p.guesses[i] && p.guesses[i] !== p.plaintext[i]));
      const candidates = blankLetters.length ? blankLetters : wrongLetters;
      if (!candidates.length) return;
      const letter = pickRandom(candidates);
      const revealed = [];
      for (let i = 0; i < p.ciphertext.length; i++) {
        if (p.ciphertext[i] === letter) {
          p.guesses[i] = p.plaintext[i];
          revealed.push(i);
        }
      }
      p.hintsRemaining--;
      hintedIndices = new Set(revealed);
      // Only move off the active blank if the hint just filled it.
      if (activeIndex === -1 || p.guesses[activeIndex]) advanceActive();
      renderGrid();
      renderKeyboard();
      updateHintButton();
      checkComplete();
    }

    function solvePuzzle() {
      p.solved = true;
      hintedIndices = new Set();
      updateHintButton();
      puzzleFeedbackEl.className = 'puzzle-feedback correct';
      if (isTest) {
        puzzleFeedbackEl.textContent = '✓ Solved! ' + p.plaintext + ' (' + p.answer + ')';
        puzzleAgainEl.hidden = false;
      } else {
        puzzleFeedbackEl.textContent = '✓ Correct! Flip over card ' + p.answer + '!';
        const cardHintEl = document.querySelector('.card[data-number="' + num + '"] .hint');
        if (cardHintEl) cardHintEl.textContent = 'Flip over card ' + p.answer + '!';
        setTimeout(() => {
          zoomCardEl.classList.remove('has-puzzle');
          zoomHintEl.hidden = false;
          zoomPuzzleEl.hidden = true;
          zoomHintEl.textContent = 'Flip over card ' + p.answer + '!';
        }, 900);
      }
    }

    function checkComplete() {
      const allFilled = p.guesses.every((g, i) => p.ciphertext[i] === ' ' || g);
      if (!allFilled) return;
      const allCorrect = p.guesses.every((g, i) => p.ciphertext[i] === ' ' || g === p.plaintext[i]);
      if (allCorrect) {
        solvePuzzle();
      } else {
        puzzleFeedbackEl.textContent = 'Close! Fix the red letters.';
        puzzleFeedbackEl.className = 'puzzle-feedback wrong';
      }
    }

    function applyGuess(index, letter) {
      const ch = p.ciphertext[index];
      for (let i = 0; i < p.ciphertext.length; i++) {
        if (p.ciphertext[i] === ch) p.guesses[i] = letter;
      }
    }

    function clearGuess(index) {
      const ch = p.ciphertext[index];
      for (let i = 0; i < p.ciphertext.length; i++) {
        if (p.ciphertext[i] === ch) p.guesses[i] = null;
      }
    }

    function renderGrid() {
      cipherGridEl.innerHTML = '';
      let wordEl = null;
      p.ciphertext.split('').forEach((ch, i) => {
        if (ch === ' ') {
          wordEl = null;
          return;
        }
        if (!wordEl) {
          wordEl = document.createElement('div');
          wordEl.className = 'cipher-word';
          cipherGridEl.appendChild(wordEl);
        }
        const guess = p.guesses[i];
        const isCorrect = guess && guess === p.plaintext[i];
        const isWrong = guess && guess !== p.plaintext[i];
        const isHinted = hintedIndices.has(i);

        // For the cryptogram, showing ch (the real letter) would give away
        // the answer, so it shows the letter's assigned number instead —
        // a repeated letter reads as a repeated number, a pattern hint
        // without revealing which letter it actually is.
        const cipherCharInner = p.type === 'cryptogram'
          ? `<div class="cipher-cipherchar">${p.numberForLetter[ch]}</div>`
          : `<div class="cipher-cipherchar">${ch}</div>`;
        const unit = document.createElement('div');
        unit.className = 'cipher-letter';
        unit.innerHTML = `
          ${cipherCharInner}
          <div class="cipher-blank${i === activeIndex ? ' active' : ''}${isCorrect ? ' correct' : ''}${isWrong ? ' wrong' : ''}${isHinted ? ' hinted' : ''}">${guess || '_'}</div>
        `;
        unit.querySelector('.cipher-blank').addEventListener('click', () => {
          activeIndex = i;
          hintedIndices = new Set();
          renderGrid();
        });
        wordEl.appendChild(unit);
      });
    }

    function renderKeyboard() {
      cipherKeyboardEl.innerHTML = '';
      // Cryptogram only: a letter already placed anywhere greys out, since
      // every occurrence of a real letter is always the same group here
      // (ciphertext === plaintext) — there's never a reason to place it
      // again elsewhere. Clear it (backspace) to free it back up.
      const usedLetters = p.type === 'cryptogram' ? new Set(p.guesses.filter(Boolean)) : null;
      p.keyboard.forEach((letter) => {
        const isUsed = !!usedLetters && usedLetters.has(letter);
        const key = document.createElement('button');
        key.className = 'cipher-key' + (isUsed ? ' used' : '');
        key.textContent = letter;
        key.disabled = isUsed;
        key.addEventListener('click', () => {
          if (activeIndex === -1 || p.solved || isUsed) return;
          applyGuess(activeIndex, letter);
          advanceActive();
          hintedIndices = new Set();
          renderGrid();
          renderKeyboard();
          checkComplete();
        });
        cipherKeyboardEl.appendChild(key);
      });
      const back = document.createElement('button');
      back.className = 'cipher-key cipher-key-back';
      back.textContent = '⌫';
      back.addEventListener('click', () => {
        if (p.solved) return;
        if (activeIndex !== -1 && p.guesses[activeIndex]) {
          clearGuess(activeIndex);
        } else {
          const from = activeIndex === -1 ? p.ciphertext.length : activeIndex;
          for (let i = from - 1; i >= 0; i--) {
            if (p.ciphertext[i] !== ' ') {
              activeIndex = i;
              clearGuess(i);
              break;
            }
          }
        }
        hintedIndices = new Set();
        renderGrid();
        renderKeyboard();
        puzzleFeedbackEl.textContent = '';
        puzzleFeedbackEl.className = 'puzzle-feedback';
      });
      cipherKeyboardEl.appendChild(back);
    }

    renderGrid();
    renderKeyboard();

    puzzleAgainEl.onclick = () => {
      if (opts.onRetry) opts.onRetry();
    };
  }

  function renderSliderPuzzle(content, num, opts) {
    opts = opts || {};
    const isTest = !!opts.isTest;
    const p = content.puzzle;

    cipherGridEl.hidden = true;
    cipherKeyboardEl.hidden = true;
    sliderGridEl.hidden = false;
    swapGridEl.hidden = true;
    pipesGridEl.hidden = true;
    shapesAreaEl.hidden = true;

    puzzleInstructionsEl.textContent = 'Slide the tiles into order, 1 through 8. Tap any ' +
      'tile next to the empty space to move it there.';
    puzzleFeedbackEl.textContent = '';
    puzzleFeedbackEl.className = 'puzzle-feedback';
    // Not implemented for this puzzle type yet (it's not in regular play).
    puzzleHintEl.hidden = true;
    puzzleAgainEl.hidden = true;
    puzzleRevealEl.hidden = true;
    puzzleRevealToggleEl.textContent = '\u{1F50D} Show Answer (dev)';
    puzzleRevealToggleEl.onclick = () => {
      const showing = !puzzleRevealEl.hidden;
      puzzleRevealEl.hidden = showing;
      puzzleRevealToggleEl.textContent = showing
        ? '\u{1F50D} Show Answer (dev)'
        : '\u{1F648} Hide Answer';
      puzzleRevealEl.textContent = p.reveal;
    };

    function solvePuzzle() {
      p.solved = true;
      puzzleFeedbackEl.className = 'puzzle-feedback correct';
      if (isTest) {
        puzzleFeedbackEl.textContent = '✓ Solved! (' + p.answer + ')';
        puzzleAgainEl.hidden = false;
      } else {
        puzzleFeedbackEl.textContent = '✓ Correct! Flip over card ' + p.answer + '!';
        const cardHintEl = document.querySelector('.card[data-number="' + num + '"] .hint');
        if (cardHintEl) cardHintEl.textContent = 'Flip over card ' + p.answer + '!';
        setTimeout(() => {
          zoomCardEl.classList.remove('has-puzzle');
          zoomHintEl.hidden = false;
          zoomPuzzleEl.hidden = true;
          zoomHintEl.textContent = 'Flip over card ' + p.answer + '!';
        }, 900);
      }
    }

    function renderTiles() {
      sliderGridEl.innerHTML = '';
      const blankIdx = p.tiles.indexOf(null);
      const movable = p.solved ? [] : sliderNeighbors(blankIdx);
      p.tiles.forEach((value, i) => {
        const tile = document.createElement('button');
        const isBlank = value === null;
        tile.className = 'slider-tile' + (isBlank ? ' slider-tile-blank' : '') +
          (movable.includes(i) ? ' movable' : '');
        tile.textContent = isBlank ? '' : String(value);
        tile.disabled = isBlank || p.solved;
        tile.addEventListener('click', () => {
          if (p.solved || !movable.includes(i)) return;
          p.tiles[blankIdx] = value;
          p.tiles[i] = null;
          renderTiles();
          if (p.tiles.every((v, idx) => v === SLIDER_SOLVED[idx])) {
            solvePuzzle();
            renderTiles();
          }
        });
        sliderGridEl.appendChild(tile);
      });
    }

    renderTiles();

    puzzleAgainEl.onclick = () => {
      if (opts.onRetry) opts.onRetry();
    };
  }

  function renderSwapPuzzle(content, num, opts) {
    opts = opts || {};
    const isTest = !!opts.isTest;
    const p = content.puzzle;
    const solved = Array.from({ length: SWAP_SIZE * SWAP_SIZE }, (_, i) => i + 1);

    cipherGridEl.hidden = true;
    cipherKeyboardEl.hidden = true;
    sliderGridEl.hidden = true;
    swapGridEl.hidden = false;
    pipesGridEl.hidden = true;
    shapesAreaEl.hidden = true;

    puzzleInstructionsEl.textContent = 'Tap a tile, then tap another to swap them. ' +
      'Arrange 1 through 16 in order to solve it.';
    puzzleFeedbackEl.textContent = '';
    puzzleFeedbackEl.className = 'puzzle-feedback';
    puzzleAgainEl.hidden = true;
    puzzleRevealEl.hidden = true;
    puzzleRevealToggleEl.textContent = '\u{1F50D} Show Answer (dev)';
    puzzleRevealToggleEl.onclick = () => {
      const showing = !puzzleRevealEl.hidden;
      puzzleRevealEl.hidden = showing;
      puzzleRevealToggleEl.textContent = showing
        ? '\u{1F50D} Show Answer (dev)'
        : '\u{1F648} Hide Answer';
      puzzleRevealEl.textContent = p.reveal;
    };

    puzzleHintEl.hidden = false;
    updateHintButton();
    puzzleHintEl.onclick = useHint;

    let selectedIdx = -1;
    let hintedIndices = new Set();

    function updateHintButton() {
      puzzleHintEl.textContent = '\u{1F4A1} Hint (' + p.hintsRemaining + ')';
      puzzleHintEl.disabled = p.solved || p.hintsRemaining <= 0;
    }

    // Picks a tile that's not yet in its correct spot and swaps it with
    // whatever tile currently sits where it belongs — usually corrects two
    // tiles for the price of one hint.
    function useHint() {
      if (p.solved || p.hintsRemaining <= 0) return;
      const wrongIndices = [];
      for (let i = 0; i < p.tiles.length; i++) {
        if (p.tiles[i] !== solved[i]) wrongIndices.push(i);
      }
      if (!wrongIndices.length) return;
      const i = pickRandom(wrongIndices);
      const j = p.tiles.indexOf(solved[i]);
      [p.tiles[i], p.tiles[j]] = [p.tiles[j], p.tiles[i]];
      p.hintsRemaining--;
      hintedIndices = new Set([i, j]);
      selectedIdx = -1;
      renderTiles();
      updateHintButton();
      if (p.tiles.every((v, idx) => v === solved[idx])) {
        solvePuzzle();
        renderTiles();
      }
    }

    function solvePuzzle() {
      p.solved = true;
      hintedIndices = new Set();
      updateHintButton();
      puzzleFeedbackEl.className = 'puzzle-feedback correct';
      if (isTest) {
        puzzleFeedbackEl.textContent = '✓ Solved! (' + p.answer + ')';
        puzzleAgainEl.hidden = false;
      } else {
        puzzleFeedbackEl.textContent = '✓ Correct! Flip over card ' + p.answer + '!';
        const cardHintEl = document.querySelector('.card[data-number="' + num + '"] .hint');
        if (cardHintEl) cardHintEl.textContent = 'Flip over card ' + p.answer + '!';
        setTimeout(() => {
          zoomCardEl.classList.remove('has-puzzle');
          zoomHintEl.hidden = false;
          zoomPuzzleEl.hidden = true;
          zoomHintEl.textContent = 'Flip over card ' + p.answer + '!';
        }, 900);
      }
    }

    function renderTiles() {
      swapGridEl.innerHTML = '';
      p.tiles.forEach((value, i) => {
        const tile = document.createElement('button');
        const isCorrect = value === solved[i];
        tile.className = 'swap-tile' + (i === selectedIdx ? ' selected' : '') +
          (isCorrect ? ' correct' : '') + (hintedIndices.has(i) ? ' hinted' : '');
        tile.textContent = String(value);
        tile.disabled = p.solved;
        tile.addEventListener('click', () => {
          if (p.solved) return;
          hintedIndices = new Set();
          if (selectedIdx === -1) {
            selectedIdx = i;
          } else if (selectedIdx === i) {
            selectedIdx = -1;
          } else {
            [p.tiles[selectedIdx], p.tiles[i]] = [p.tiles[i], p.tiles[selectedIdx]];
            selectedIdx = -1;
          }
          renderTiles();
          if (p.tiles.every((v, idx) => v === solved[idx])) {
            solvePuzzle();
            renderTiles();
          }
        });
        swapGridEl.appendChild(tile);
      });
    }

    renderTiles();

    puzzleAgainEl.onclick = () => {
      if (opts.onRetry) opts.onRetry();
    };
  }

  function renderPipesPuzzle(content, num, opts) {
    opts = opts || {};
    const isTest = !!opts.isTest;
    const p = content.puzzle;

    cipherGridEl.hidden = true;
    cipherKeyboardEl.hidden = true;
    sliderGridEl.hidden = true;
    swapGridEl.hidden = true;
    pipesGridEl.hidden = false;
    shapesAreaEl.hidden = true;

    puzzleInstructionsEl.textContent = 'Tap a pipe to rotate it. Connect S (start) to E (end) — ' +
      'those two are fixed in place.';
    puzzleFeedbackEl.textContent = '';
    puzzleFeedbackEl.className = 'puzzle-feedback';
    puzzleAgainEl.hidden = true;
    puzzleRevealEl.hidden = true;
    puzzleRevealToggleEl.textContent = '\u{1F50D} Show Answer (dev)';
    puzzleRevealToggleEl.onclick = () => {
      const showing = !puzzleRevealEl.hidden;
      puzzleRevealEl.hidden = showing;
      puzzleRevealToggleEl.textContent = showing
        ? '\u{1F50D} Show Answer (dev)'
        : '\u{1F648} Hide Answer';
      puzzleRevealEl.textContent = p.reveal;
    };

    puzzleHintEl.hidden = false;
    updateHintButton();
    puzzleHintEl.onclick = useHint;

    let hintedKey = null;

    function updateHintButton() {
      puzzleHintEl.textContent = '\u{1F4A1} Hint (' + p.hintsRemaining + ')';
      puzzleHintEl.disabled = p.solved || p.hintsRemaining <= 0;
    }

    // Snaps one wrong path tile straight to its correct orientation
    // (start/end are already fixed correctly, so only interior path
    // tiles are ever eligible).
    function useHint() {
      if (p.solved || p.hintsRemaining <= 0) return;
      const wrongPathTiles = p.tiles.filter((t) => t.isPath && t.openings !== t.correctMask);
      if (!wrongPathTiles.length) return;
      const tile = pickRandom(wrongPathTiles);
      tile.openings = tile.correctMask;
      p.hintsRemaining--;
      hintedKey = tile.row + ',' + tile.col;
      updateHintButton();
      renderTiles();
      if (pipesIsSolved(p)) {
        solvePuzzle();
        renderTiles();
      }
    }

    function solvePuzzle() {
      p.solved = true;
      hintedKey = null;
      updateHintButton();
      puzzleFeedbackEl.className = 'puzzle-feedback correct';
      if (isTest) {
        puzzleFeedbackEl.textContent = '✓ Solved! (' + p.answer + ')';
        puzzleAgainEl.hidden = false;
      } else {
        puzzleFeedbackEl.textContent = '✓ Correct! Flip over card ' + p.answer + '!';
        const cardHintEl = document.querySelector('.card[data-number="' + num + '"] .hint');
        if (cardHintEl) cardHintEl.textContent = 'Flip over card ' + p.answer + '!';
        setTimeout(() => {
          zoomCardEl.classList.remove('has-puzzle');
          zoomHintEl.hidden = false;
          zoomPuzzleEl.hidden = true;
          zoomHintEl.textContent = 'Flip over card ' + p.answer + '!';
        }, 900);
      }
    }

    function renderTiles() {
      pipesGridEl.innerHTML = '';
      pipesGridEl.style.gridTemplateColumns = 'repeat(' + p.cols + ', 46px)';
      pipesGridEl.style.gridTemplateRows = 'repeat(' + p.rows + ', 46px)';
      const connected = pipesConnectedSet(p.tiles);
      p.tiles.forEach((t) => {
        const key = t.row + ',' + t.col;
        const fixed = t.isStart || t.isEnd || !t.isPath;
        const tile = document.createElement('button');
        tile.className = 'pipe-tile' +
          (t.isStart ? ' start' : '') + (t.isEnd ? ' end' : '') +
          (!t.isPath ? ' empty' : '') +
          (connected.has(key) ? ' connected' : '') +
          (hintedKey === key ? ' hinted' : '');
        tile.disabled = p.solved || fixed;
        let inner = '';
        if (t.isPath) {
          inner += '<div class="pipe-hub"></div>';
          ['N', 'S', 'E', 'W'].forEach((dir) => {
            if (t.openings & DIR_BIT[dir]) inner += '<div class="pipe-arm ' + dir.toLowerCase() + '"></div>';
          });
        }
        if (t.isStart) inner += '<div class="pipe-badge start">S</div>';
        if (t.isEnd) inner += '<div class="pipe-badge end">E</div>';
        tile.innerHTML = inner;
        tile.addEventListener('click', () => {
          if (p.solved || fixed) return;
          hintedKey = null;
          t.openings = rotateMask(t.openings, 1);
          renderTiles();
          if (pipesIsSolved(p)) {
            solvePuzzle();
            renderTiles();
          }
        });
        pipesGridEl.appendChild(tile);
      });
    }

    renderTiles();

    puzzleAgainEl.onclick = () => {
      if (opts.onRetry) opts.onRetry();
    };
  }

  const SHAPES_CELL_PX = 38;
  const SHAPES_GRID_PAD_PX = 4;
  const SHAPES_GRID_PITCH_PX = SHAPES_CELL_PX + 2; // cell + gap

  function renderShapesPuzzle(content, num, opts) {
    opts = opts || {};
    const isTest = !!opts.isTest;
    const p = content.puzzle;

    cipherGridEl.hidden = true;
    cipherKeyboardEl.hidden = true;
    sliderGridEl.hidden = true;
    swapGridEl.hidden = true;
    pipesGridEl.hidden = true;
    shapesAreaEl.hidden = false;

    puzzleInstructionsEl.textContent = 'Drag a piece onto the board — it’ll snap into place ' +
      'if it fits. Tap a piece (without dragging) to rotate it.';
    puzzleFeedbackEl.textContent = '';
    puzzleFeedbackEl.className = 'puzzle-feedback';
    puzzleAgainEl.hidden = true;
    puzzleRevealEl.hidden = true;
    puzzleRevealToggleEl.textContent = '\u{1F50D} Show Answer (dev)';
    puzzleRevealToggleEl.onclick = () => {
      const showing = !puzzleRevealEl.hidden;
      puzzleRevealEl.hidden = showing;
      puzzleRevealToggleEl.textContent = showing
        ? '\u{1F50D} Show Answer (dev)'
        : '\u{1F648} Hide Answer';
      puzzleRevealEl.textContent = p.reveal;
    };

    puzzleHintEl.hidden = false;
    updateHintButton();
    puzzleHintEl.onclick = useHint;

    let drag = null; // { piece, pointerId, startX, startY, originalOrigin, ghostEl, widthPx, heightPx, moved, candidateRow, candidateCol }

    function updateHintButton() {
      puzzleHintEl.textContent = '\u{1F4A1} Hint (' + p.hintsRemaining + ')';
      puzzleHintEl.disabled = p.solved || p.hintsRemaining <= 0;
    }

    // Places one unplaced piece straight into its original solved slot, if
    // that slot happens to still be free (it might not be, if the player's
    // built an alternate arrangement) — tries each unplaced piece in turn.
    function useHint() {
      if (p.solved || p.hintsRemaining <= 0) return;
      const covered = shapesCoverage(p);
      const candidate = p.pieces.find((pc) => !pc.placed && shapesCanPlace(
        { currentCells: pc.solvedCells }, pc.solvedOrigin[0], pc.solvedOrigin[1], p.rows, p.cols, covered
      ));
      if (!candidate) return;
      candidate.currentCells = candidate.solvedCells;
      candidate.placed = true;
      candidate.placedOrigin = candidate.solvedOrigin;
      p.hintsRemaining--;
      updateHintButton();
      render();
      if (shapesIsSolved(p)) {
        solvePuzzle();
        render();
      }
    }

    function solvePuzzle() {
      p.solved = true;
      updateHintButton();
      puzzleFeedbackEl.className = 'puzzle-feedback correct';
      if (isTest) {
        puzzleFeedbackEl.textContent = '✓ Solved! (' + p.answer + ')';
        puzzleAgainEl.hidden = false;
      } else {
        puzzleFeedbackEl.textContent = '✓ Correct! Flip over card ' + p.answer + '!';
        const cardHintEl = document.querySelector('.card[data-number="' + num + '"] .hint');
        if (cardHintEl) cardHintEl.textContent = 'Flip over card ' + p.answer + '!';
        setTimeout(() => {
          zoomCardEl.classList.remove('has-puzzle');
          zoomHintEl.hidden = false;
          zoomPuzzleEl.hidden = true;
          zoomHintEl.textContent = 'Flip over card ' + p.answer + '!';
        }, 900);
      }
    }

    function buildGhost(piece) {
      const maxR = Math.max(...piece.currentCells.map(([r]) => r));
      const maxC = Math.max(...piece.currentCells.map(([, c]) => c));
      const cellSet = new Set(piece.currentCells.map(([r, c]) => r + ',' + c));
      const ghost = document.createElement('div');
      ghost.className = 'shapes-ghost';
      ghost.style.gridTemplateColumns = 'repeat(' + (maxC + 1) + ', ' + SHAPES_CELL_PX + 'px)';
      ghost.style.gridTemplateRows = 'repeat(' + (maxR + 1) + ', ' + SHAPES_CELL_PX + 'px)';
      for (let r = 0; r <= maxR; r++) {
        for (let c = 0; c <= maxC; c++) {
          const cellEl = document.createElement('div');
          cellEl.className = 'shapes-ghost-cell';
          cellEl.style.background = cellSet.has(r + ',' + c) ? piece.color : 'transparent';
          ghost.appendChild(cellEl);
        }
      }
      document.body.appendChild(ghost);
      return { ghost, widthPx: (maxC + 1) * SHAPES_CELL_PX, heightPx: (maxR + 1) * SHAPES_CELL_PX };
    }

    function positionGhost(clientX, clientY) {
      drag.ghostEl.style.left = (clientX - drag.widthPx / 2) + 'px';
      drag.ghostEl.style.top = (clientY - drag.heightPx / 2) + 'px';
    }

    function candidateOrigin(clientX, clientY) {
      const rect = shapesGridEl.getBoundingClientRect();
      const localX = clientX - drag.widthPx / 2 - rect.left - SHAPES_GRID_PAD_PX;
      const localY = clientY - drag.heightPx / 2 - rect.top - SHAPES_GRID_PAD_PX;
      return [Math.round(localY / SHAPES_GRID_PITCH_PX), Math.round(localX / SHAPES_GRID_PITCH_PX)];
    }

    function startDrag(piece, evt) {
      if (p.solved) return;
      evt.preventDefault();
      const originalOrigin = piece.placedOrigin;
      piece.placed = false;
      piece.placedOrigin = null;
      const { ghost, widthPx, heightPx } = buildGhost(piece);
      drag = {
        piece, pointerId: evt.pointerId, startX: evt.clientX, startY: evt.clientY,
        originalOrigin, ghostEl: ghost, widthPx, heightPx, moved: false,
      };
      positionGhost(evt.clientX, evt.clientY);
      render();
      window.addEventListener('pointermove', onDragMove);
      window.addEventListener('pointerup', onDragEnd);
      window.addEventListener('pointercancel', onDragEnd);
    }

    function onDragMove(evt) {
      if (!drag || evt.pointerId !== drag.pointerId) return;
      positionGhost(evt.clientX, evt.clientY);
      if (Math.abs(evt.clientX - drag.startX) > 6 || Math.abs(evt.clientY - drag.startY) > 6) {
        drag.moved = true;
      }
      const [row, col] = candidateOrigin(evt.clientX, evt.clientY);
      drag.candidateRow = row;
      drag.candidateCol = col;
      renderGrid();
    }

    function endDrag() {
      window.removeEventListener('pointermove', onDragMove);
      window.removeEventListener('pointerup', onDragEnd);
      window.removeEventListener('pointercancel', onDragEnd);
      drag.ghostEl.remove();
    }

    function onDragEnd(evt) {
      if (!drag || evt.pointerId !== drag.pointerId) return;
      const { piece, moved, originalOrigin, candidateRow, candidateCol } = drag;
      endDrag();
      drag = null;

      if (!moved) {
        // A tap, not a drag: rotate in place, and try to settle back where
        // it was (a placed piece might no longer fit there once rotated).
        piece.currentCells = rotatePieceCells(piece.currentCells);
        if (originalOrigin) {
          const covered = shapesCoverage(p);
          if (shapesCanPlace(piece, originalOrigin[0], originalOrigin[1], p.rows, p.cols, covered)) {
            piece.placed = true;
            piece.placedOrigin = originalOrigin;
          }
        }
        render();
        return;
      }

      const covered = shapesCoverage(p);
      if (candidateRow !== undefined && shapesCanPlace(piece, candidateRow, candidateCol, p.rows, p.cols, covered)) {
        piece.placed = true;
        piece.placedOrigin = [candidateRow, candidateCol];
        puzzleFeedbackEl.textContent = '';
        puzzleFeedbackEl.className = 'puzzle-feedback';
      } else {
        puzzleFeedbackEl.textContent = 'Doesn’t fit there!';
        puzzleFeedbackEl.className = 'puzzle-feedback wrong';
      }
      render();
      if (shapesIsSolved(p)) {
        solvePuzzle();
        render();
      }
    }

    function renderGrid() {
      shapesGridEl.innerHTML = '';
      shapesGridEl.style.gridTemplateColumns = 'repeat(' + p.cols + ', ' + SHAPES_CELL_PX + 'px)';
      shapesGridEl.style.gridTemplateRows = 'repeat(' + p.rows + ', ' + SHAPES_CELL_PX + 'px)';
      const covered = shapesCoverage(p);

      let previewCells = null;
      let previewValid = false;
      if (drag && drag.candidateRow !== undefined) {
        previewValid = shapesCanPlace(
          { currentCells: drag.piece.currentCells }, drag.candidateRow, drag.candidateCol, p.rows, p.cols, covered
        );
        previewCells = new Set(drag.piece.currentCells.map(([dr, dc]) =>
          (drag.candidateRow + dr) + ',' + (drag.candidateCol + dc)));
      }

      for (let r = 0; r < p.rows; r++) {
        for (let c = 0; c < p.cols; c++) {
          const key = r + ',' + c;
          const pieceId = covered[r * p.cols + c];
          const cell = document.createElement('div');
          cell.className = 'shapes-cell' + (pieceId !== null ? ' filled' : '');
          if (pieceId !== null) {
            const piece = p.pieces.find((pc) => pc.id === pieceId);
            cell.style.background = piece.color;
            if (!p.solved) {
              cell.addEventListener('pointerdown', (evt) => startDrag(piece, evt));
            }
          }
          if (previewCells && previewCells.has(key)) {
            cell.classList.add(previewValid ? 'preview-valid' : 'preview-invalid');
          }
          shapesGridEl.appendChild(cell);
        }
      }
    }

    function renderTray() {
      shapesTrayEl.innerHTML = '';
      p.pieces.filter((pc) => !pc.placed).forEach((piece) => {
        const maxR = Math.max(...piece.currentCells.map(([r]) => r));
        const maxC = Math.max(...piece.currentCells.map(([, c]) => c));
        const cellSet = new Set(piece.currentCells.map(([r, c]) => r + ',' + c));
        const wrap = document.createElement('div');
        wrap.className = 'shapes-piece';
        wrap.style.gridTemplateColumns = 'repeat(' + (maxC + 1) + ', 14px)';
        wrap.style.gridTemplateRows = 'repeat(' + (maxR + 1) + ', 14px)';
        for (let r = 0; r <= maxR; r++) {
          for (let c = 0; c <= maxC; c++) {
            const cellEl = document.createElement('div');
            cellEl.className = 'shapes-piece-cell';
            cellEl.style.background = cellSet.has(r + ',' + c) ? piece.color : 'transparent';
            wrap.appendChild(cellEl);
          }
        }
        wrap.addEventListener('pointerdown', (evt) => startDrag(piece, evt));
        shapesTrayEl.appendChild(wrap);
      });
    }

    function render() {
      renderGrid();
      renderTray();
    }

    render();

    puzzleAgainEl.onclick = () => {
      if (opts.onRetry) opts.onRetry();
    };
  }

  function openTestPuzzle(type) {
    const game = MINI_GAMES[type];
    let content = null;

    if (MINI_GAMES[type]) {
      const target = 1 + Math.floor(Math.random() * CARD_COUNT);
      const makers = {
        cryptogram: makeCryptogramPuzzle, cipher: makeCipherPuzzle,
        slider: makeSliderPuzzle, swap: makeSwapPuzzle, pipes: makePipesPuzzle, shapes: makeShapesPuzzle,
      };
      content = {
        isStory: false,
        isWin: false,
        message: '\u{1F9EA} ' + game.label + ' — Test Mode',
        puzzle: makers[type](target),
        backItem: null,
      };
    }

    if (!content) return;

    zoomCardEl.classList.remove('story', 'win');
    zoomCardEl.classList.add('has-puzzle');
    zoomNumberEl.textContent = game.label + ' Test';
    zoomItemArtEl.hidden = true;
    zoomItemArtEl.innerHTML = '';
    zoomMessageEl.textContent = content.message;
    zoomHintEl.hidden = true;
    zoomPuzzleEl.hidden = false;

    renderPuzzle(content, null, { isTest: true, onRetry: () => openTestPuzzle(type) });

    zoomOverlay.classList.add('open');
  }

  function closeZoom() {
    zoomOverlay.classList.remove('open');
  }

  zoomCloseEl.addEventListener('click', closeZoom);
  zoomOverlay.addEventListener('click', (e) => {
    if (e.target === zoomOverlay) closeZoom();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeZoom();
  });

  // --- Init ---

  renderHome();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
