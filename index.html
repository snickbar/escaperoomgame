<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Escape Room Card Game</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14161c">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Escape Room">

<style>
  :root {
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: #14161c;
    font-family: system-ui, -apple-system, sans-serif;
    color: #cfd3dc;
    padding: calc(24px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  }

  h1 {
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    color: #e4e7ee;
    margin: 0 0 12px;
  }

  [hidden] {
    display: none !important;
  }

  /* --- Home screen --- */

  .home-subtitle {
    text-align: center;
    font-size: 13px;
    color: #7a8194;
    margin: 0 0 28px;
  }

  .deck-grid {
    max-width: 440px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .deck-tile {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    border-radius: 14px;
    border: 2px solid #3d4250;
    background: linear-gradient(135deg, #22252e, #1a1c22);
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    color: inherit;
    width: 100%;
  }

  .deck-tile:hover {
    filter: brightness(1.08);
  }

  .deck-icon {
    font-size: 32px;
    flex-shrink: 0;
  }

  .deck-info {
    flex: 1;
    min-width: 0;
  }

  .deck-name {
    font-size: 17px;
    font-weight: 700;
    color: #e4e7ee;
  }

  .deck-tagline {
    font-size: 12px;
    color: #9aa0ad;
    margin-top: 2px;
  }

  .deck-badge {
    font-size: 11px;
    color: #7ee6a8;
    margin-top: 6px;
    font-weight: 600;
  }

  /* --- Game screen --- */

  .home-link {
    display: block;
    margin: 0 auto 16px;
    background: none;
    border: none;
    color: #9aa0ad;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    padding: 6px 10px;
  }

  .debug-next-btn {
    display: block;
    margin: 0 auto 16px;
    background: none;
    border: 1px dashed #5a6072;
    border-radius: 8px;
    color: #7a8194;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
    padding: 5px 10px;
  }

  .debug-next-btn:hover {
    color: #cfd3dc;
    border-color: #7a8194;
  }

  .home-link:hover {
    color: #cfd3dc;
  }

  .lives {
    text-align: center;
    font-size: 26px;
    letter-spacing: 8px;
    margin-bottom: 24px;
  }

  .life {
    display: inline-block;
    transition: transform 0.25s ease, opacity 0.25s ease;
  }

  .life.lost {
    opacity: 0.35;
    transform: scale(0.85);
  }

  .scene {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }

  /* --- Deck pile --- */

  .deck-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    opacity: 1;
    transform: scale(1);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .deck-wrap.gone {
    opacity: 0;
    transform: scale(0.8);
    pointer-events: none;
  }

  .deck {
    position: relative;
    width: 120px;
    height: 168px;
    cursor: pointer;
  }

  .deck[data-empty="true"] {
    cursor: default;
    pointer-events: none;
  }

  .deck-card {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    background: repeating-linear-gradient(135deg, #2b2f3a, #2b2f3a 8px, #262a34 8px, #262a34 16px);
    border: 2px solid #3d4250;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    transition: transform 0.2s ease;
  }

  .deck:hover .deck-card {
    transform: translateY(-4px);
  }

  .deck-caption {
    text-align: center;
    font-size: 13px;
    color: #7a8194;
    line-height: 1.5;
  }

  .deck-caption strong {
    color: #b7bcc9;
    font-size: 15px;
  }

  /* --- Table --- */

  .table {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 16px;
    justify-items: center;
  }

  /* --- Card --- */

  .card {
    position: relative;
    width: 110px;
    height: 154px;
    perspective: 1000px;
    cursor: pointer;
    opacity: 1;
    transform: none;
    animation: dealIn 0.4s ease forwards;
  }

  @keyframes dealIn {
    from {
      opacity: 0;
      transform: translateY(12px) scale(0.9);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .card.wrong {
    animation: shake 0.4s ease;
    box-shadow: 0 0 0 3px rgba(224, 82, 82, 0.6);
    border-radius: 10px;
  }

  @keyframes shake {
    10%, 90% { transform: translateX(-3px); }
    20%, 80% { transform: translateX(5px); }
    30%, 50%, 70% { transform: translateX(-7px); }
    40%, 60% { transform: translateX(7px); }
  }

  .wrong-mark {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    font-weight: 800;
    color: #ff5c5c;
    text-shadow: 0 0 14px rgba(255, 92, 92, 0.85);
    opacity: 0;
    pointer-events: none;
    z-index: 5;
    transition: opacity 0.2s ease;
  }

  .card.wrong .wrong-mark {
    opacity: 1;
    animation: wrongPop 0.5s ease;
  }

  @keyframes wrongPop {
    0% { opacity: 0; transform: scale(0.4); }
    35% { opacity: 1; transform: scale(1.2); }
    60% { transform: scale(1); }
    100% { opacity: 1; transform: scale(1); }
  }

  .card.correct {
    animation: correctRing 0.6s ease;
    border-radius: 10px;
  }

  @keyframes correctRing {
    0% { box-shadow: 0 0 0 0 rgba(126, 230, 168, 0.7); }
    60% { box-shadow: 0 0 0 12px rgba(126, 230, 168, 0); }
    100% { box-shadow: 0 0 0 0 rgba(126, 230, 168, 0); }
  }

  .correct-mark {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    font-weight: 800;
    color: #7ee6a8;
    text-shadow: 0 0 14px rgba(126, 230, 168, 0.85);
    opacity: 0;
    pointer-events: none;
    z-index: 5;
    transition: opacity 0.2s ease;
  }

  .card.correct .correct-mark {
    opacity: 1;
    animation: correctPop 0.6s ease;
  }

  @keyframes correctPop {
    0% { opacity: 0; transform: scale(0.4); }
    35% { opacity: 1; transform: scale(1.25); }
    60% { transform: scale(1); }
    100% { opacity: 1; transform: scale(1); }
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.6s;
    transform-style: preserve-3d;
  }

  .card.flipped .card-inner {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px;
    box-sizing: border-box;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
    overflow: hidden;
  }

  .card-back {
    background: linear-gradient(135deg, #2b2f3a, #1a1c22);
    border: 2px solid #3d4250;
    flex-direction: column;
    gap: 4px;
  }

  .card-back .card-number {
    font-size: 40px;
    font-weight: 700;
    color: #6c7a96;
  }

  .card-front {
    background: linear-gradient(135deg, #2f6a4f, #1c3f31);
    border: 2px solid #4caf7d;
    transform: rotateY(180deg);
    flex-direction: column;
    gap: 6px;
  }

  .card-front .front-number {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: #9fd6b8;
    opacity: 0.75;
  }

  .card-front .front-icon {
    font-size: 26px;
    line-height: 1;
  }

  /* Item cards (object/combo art): the picture is the card — it fills
     almost all the space below the small number, with no competing text. */
  .card-front.has-art {
    padding: 6px;
    gap: 4px;
  }

  .card-front.has-art .front-icon {
    flex: 1;
    width: 100%;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
  }

  .card-front.has-art .front-icon .item-art {
    width: 100%;
    height: 100%;
  }

  .item-art {
    display: inline-block;
    height: 58px;
    width: auto;
    aspect-ratio: 385 / 507;
    object-fit: cover;
    border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    vertical-align: middle;
  }

  .hint .item-art {
    height: 18px;
    border-radius: 3px;
    margin: 0 2px -4px;
    box-shadow: none;
  }

  .card-front .message {
    font-size: 14px;
    font-weight: 600;
    color: #d8f5e6;
  }

  .card-front .hint {
    font-size: 10px;
    color: #9fd6b8;
  }

  .card-front.story {
    background: linear-gradient(135deg, #6a4f2f, #3f2f1c);
    border-color: #cfa04c;
  }

  .card-front.story .message {
    color: #f5e6d8;
  }

  .card-front.story .hint {
    color: #d6b89f;
  }

  .card-front.story .front-number {
    color: #d6b89f;
  }

  .card-front.win {
    background: linear-gradient(135deg, #6a3f8f, #2f1c4f);
    border-color: #b98cf0;
  }

  .card-front.win .message {
    color: #f0e6f9;
  }

  .card-front.win .hint {
    color: #d6b9f0;
  }

  .card-front.win .front-number {
    color: #d6b9f0;
  }

  .hint {
    color: #7a8194;
    font-size: 13px;
  }

  /* --- Zoom overlay --- */

  .zoom-overlay {
    position: fixed;
    inset: 0;
    background: rgba(8, 9, 12, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    padding: 16px;
  }

  .zoom-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .zoom-card {
    position: relative;
    width: min(85vw, 420px);
    aspect-ratio: 110 / 154;
    max-height: 82vh;
    background: linear-gradient(135deg, #2f6a4f, #1c3f31);
    border: 2px solid #4caf7d;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
    padding: 32px;
    transform: scale(0.85) translateY(12px);
    transition: transform 0.25s ease;
  }

  .zoom-overlay.open .zoom-card {
    transform: scale(1) translateY(0);
  }

  .zoom-card.has-puzzle {
    aspect-ratio: unset;
    width: min(92vw, 420px);
  }

  .zoom-number {
    font-size: 15px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #9fd6b8;
  }

  .zoom-message {
    font-size: 32px;
    font-weight: 700;
    color: #d8f5e6;
  }

  .zoom-hint {
    font-size: 14px;
    color: #9fd6b8;
  }

  .zoom-item-art {
    width: 100%;
    max-width: 260px;
    aspect-ratio: 385 / 507;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  }

  .zoom-item-art .item-art {
    width: 100%;
    height: 100%;
    border-radius: 12px;
    box-shadow: none;
  }

  .zoom-card.story {
    background: linear-gradient(135deg, #6a4f2f, #3f2f1c);
    border-color: #cfa04c;
  }

  .zoom-card.story .zoom-number {
    color: #d6b89f;
  }

  .zoom-card.story .zoom-message {
    color: #f5e6d8;
  }

  .zoom-card.story .zoom-hint {
    color: #d6b89f;
  }

  .zoom-card.win {
    background: linear-gradient(135deg, #6a3f8f, #2f1c4f);
    border-color: #b98cf0;
  }

  .zoom-card.win .zoom-number {
    color: #d6b9f0;
  }

  .zoom-card.win .zoom-message {
    color: #f0e6f9;
  }

  .zoom-card.win .zoom-hint {
    color: #d6b9f0;
  }

  .zoom-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: rgba(0, 0, 0, 0.3);
    color: #d8f5e6;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .zoom-close:hover {
    background: rgba(0, 0, 0, 0.5);
  }

  /* --- Cipher puzzle --- */

  .zoom-puzzle {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
  }

  .puzzle-instructions {
    font-size: 12px;
    color: #9fd6b8;
    line-height: 1.4;
  }

  .cipher-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 14px;
    width: 100%;
  }

  .cipher-word {
    display: flex;
    flex-wrap: nowrap;
    gap: 4px;
  }

  .cipher-letter {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .cipher-cipherchar {
    font-family: 'Courier New', monospace;
    font-size: 15px;
    font-weight: 700;
    color: #9fd6b8;
    opacity: 0.8;
  }

  .cipher-blank {
    width: 26px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 2px solid #4caf7d;
    font-size: 16px;
    font-weight: 700;
    color: #d8f5e6;
    cursor: pointer;
    border-radius: 4px;
  }

  .cipher-blank.active {
    background: rgba(76, 175, 125, 0.25);
  }

  .cipher-blank.correct {
    color: #7ee6a8;
    border-bottom-color: #7ee6a8;
  }

  .cipher-blank.wrong {
    color: #ff9a9a;
    border-bottom-color: #ff9a9a;
  }

  .cipher-keyboard {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    width: 100%;
  }

  .cipher-key {
    width: 30px;
    height: 36px;
    border-radius: 6px;
    border: none;
    background: rgba(255, 255, 255, 0.1);
    color: #d8f5e6;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }

  .cipher-key:hover {
    background: rgba(255, 255, 255, 0.18);
  }

  .cipher-key-back {
    background: rgba(224, 82, 82, 0.3);
    width: 44px;
  }

  .cipher-key-back:hover {
    background: rgba(224, 82, 82, 0.45);
  }

  .puzzle-feedback {
    font-size: 13px;
    font-weight: 600;
    min-height: 18px;
  }

  .puzzle-feedback.correct {
    color: #7ee6a8;
  }

  .puzzle-feedback.wrong {
    color: #ff9a9a;
  }

  .puzzle-again {
    border: none;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.1);
    color: #d8f5e6;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    cursor: pointer;
    font-family: inherit;
  }

  .puzzle-again:hover {
    background: rgba(255, 255, 255, 0.18);
  }

  .puzzle-reveal-toggle {
    border: none;
    background: none;
    color: #7a8194;
    font-size: 11px;
    text-decoration: underline;
    cursor: pointer;
    font-family: inherit;
    padding: 4px;
  }

  .puzzle-reveal-toggle:hover {
    color: #9aa0ad;
  }

  .puzzle-reveal {
    font-size: 12px;
    color: #ffd76a;
    font-weight: 600;
    background: rgba(0, 0, 0, 0.25);
    border-radius: 6px;
    padding: 6px 10px;
  }

  /* --- Game over overlay --- */

  .gameover-overlay {
    position: fixed;
    inset: 0;
    background: rgba(8, 9, 12, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    padding: 16px;
  }

  .gameover-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .gameover-card {
    width: min(90vw, 360px);
    background: linear-gradient(135deg, #6a2f2f, #3f1c1c);
    border: 2px solid #e05252;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    padding: 36px 28px;
    text-align: center;
    transform: scale(0.85);
    transition: transform 0.3s ease;
  }

  .gameover-overlay.open .gameover-card {
    transform: scale(1);
  }

  .gameover-title {
    font-size: 28px;
    font-weight: 700;
    color: #f9d8d8;
    margin-bottom: 10px;
  }

  .gameover-message {
    font-size: 14px;
    color: #e0b9b9;
    margin-bottom: 24px;
  }

  .gameover-button {
    border: none;
    border-radius: 8px;
    background: #e05252;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 24px;
    cursor: pointer;
  }

  .gameover-button:hover {
    background: #ea6868;
  }

  /* --- Win overlay --- */

  .win-overlay {
    position: fixed;
    inset: 0;
    background: rgba(8, 9, 12, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    padding: 16px;
  }

  .win-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .win-card {
    width: min(90vw, 380px);
    background: linear-gradient(135deg, #6a3f8f, #2f1c4f);
    border: 2px solid #b98cf0;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    padding: 32px 28px;
    text-align: center;
    transform: scale(0.85);
    transition: transform 0.3s ease;
  }

  .win-overlay.open .win-card {
    transform: scale(1);
  }

  .win-title {
    font-size: 26px;
    font-weight: 700;
    color: #f0e6f9;
    margin-bottom: 18px;
  }

  .win-stats {
    background: rgba(0, 0, 0, 0.2);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }

  .win-stat {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: #e5d6f5;
    padding: 4px 0;
  }

  .win-stat-label {
    color: #c9a9ec;
  }

  .win-newbest {
    font-size: 12px;
    font-weight: 700;
    color: #ffd76a;
    margin-bottom: 18px;
  }

  .win-buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 10px;
  }

  .win-btn {
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 24px;
    cursor: pointer;
    font-family: inherit;
  }

  .win-btn-primary {
    background: #b98cf0;
    color: #2f1c4f;
  }

  .win-btn-primary:hover {
    background: #c9a3f5;
  }

  .win-btn-secondary {
    background: rgba(255, 255, 255, 0.1);
    color: #f0e6f9;
  }

  .win-btn-secondary:hover {
    background: rgba(255, 255, 255, 0.18);
  }

  /* --- Toast --- */

  .toast {
    position: fixed;
    top: 116px;
    left: 50%;
    transform: translateX(-50%) translateY(-14px);
    background: rgba(224, 82, 82, 0.95);
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    padding: 12px 22px;
    border-radius: 8px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 1200;
    text-align: center;
  }

  .toast.show {
    opacity: 1;

  // `count` unique numbers drawn from 1..max, already in random order —
  // used by Story Mode so card values (and their table position) never
  // just count upward.
  function randomNumbers(count, max) {
    const pool = Array.from({ length: max }, (_, i) => i + 1);
    return shuffle(pool).slice(0, count);
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

    'ELEVEN', 'TWELVE', 'THIRTEEN', 'FOURTEEN', 'FIFTEEN', 'SIXTEEN', 'SEVENTEEN', 'EIGHTEEN',
    'NINETEEN', 'TWENTY',
  ];

  const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const EXTRA_KEYBOARD_LETTERS = 8;

  const CIPHER_TEMPLATES = [
    (w) => 'FLIP CARD ' + w,
    (w) => 'YOUR NEXT CLUE IS CARD ' + w,
    (w) => 'SEEK OUT CARD ' + w,
    (w) => 'THE ANSWER LIES AT CARD ' + w,
    (w) => 'TURN OVER CARD ' + w + ' NEXT',
    (w) => 'CARD ' + w + ' HOLDS THE TRUTH',
    (w) => 'PROCEED TO CARD ' + w,
    (w) => 'THE TRAIL LEADS TO CARD ' + w,
    (w) => 'GO FIND CARD ' + w,
    (w) => 'CARD ' + w + ' IS YOUR TARGET',
    (w) => 'REVEAL WHAT CARD ' + w + ' HIDES',
    (w) => 'CARD ' + w + ' AWAITS YOU',
  ];

  function makeCipherPuzzle(target) {
    const shift = 1 + Math.floor(Math.random() * 5);
    const template = CIPHER_TEMPLATES[Math.floor(Math.random() * CIPHER_TEMPLATES.length)];
    const phrase = template(NUMBER_WORDS[target]);
    const ciphertext = phrase.split('').map((ch) => {
      if (ch === ' ') return ' ';
      const code = ch.charCodeAt(0) - 65;
      return String.fromCharCode(((code + shift) % 26) + 65);
    }).join('');

    const needed = new Set(phrase.replace(/[^A-Z]/g, '').split(''));
    const extra = shuffle(ALPHABET.filter((l) => !needed.has(l))).slice(0, EXTRA_KEYBOARD_LETTERS);
    const keyboard = [...needed, ...extra].sort();

    return {
      ciphertext,
      plaintext: phrase,
      shift,
      answer: target,
      solved: false,
      guesses: new Array(ciphertext.length).fill(null),
      keyboard,
      reveal: phrase + ' (' + target + ')',
    };
  }

  function mediumHintText(target) {
    const useSubtraction = Math.random() < 0.4;
    if (useSubtraction) {
      const b = 1 + Math.floor(Math.random() * 5);
      const a = target + b;
      return 'What is ' + a + ' - ' + b + '?';
    }
    const a = target <= 1 ? 0 : 1 + Math.floor(Math.random() * (target - 1));
    const b = target - a;
    return 'What is ' + a + ' + ' + b + '?';
  }

  function buildHardChain(numbers) {
    const seed1 = 1;
    const seed2 = 2;
    const pool = [seed1, seed2];
    const chain = [seed1, seed2];
    const used = new Set(chain);
    const pairFor = {};
    let last = seed2;
    const maxSteps = 14;

    for (let step = 0; step < maxSteps; step++) {
      const options = [];
      pool.forEach((other) => {
        if (other === last) return;
        const sum = other + last;
        if (sum <= CARD_COUNT && !used.has(sum)) {
          options.push({ other, sum });
        }
      });
      if (options.length === 0) break;
      const pick = options[Math.floor(Math.random() * options.length)];
      pairFor[pick.sum] = [last, pick.other];
      used.add(pick.sum);
      pool.push(pick.sum);
      chain.push(pick.sum);
      last = pick.sum;
    }

    return { chain, pairFor };
  }

      const now = audioCtx.currentTime;
      // A quick two-note ascending "ding" — no audio asset needed.
      [523.25, 783.99].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        const start = now + i * 0.08;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.25, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.22);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.24);
      });
    } catch (e) {
      // Audio is a nice-to-have; never let it break the game.
    }
  }

  function loseLife() {
    lives--;
    mistakes++;
    renderLives();
    if (lives <= 0) {
      showToast('Sorry, game over! Please try again.');
      setTimeout(() => {
        gameOverOverlayEl.classList.add('open');
      }, 500);
    } else {
      showToast('Incorrect, try again!');
    }
  }

  gameOverRestartEl.addEventListener('click', () => {
    gameOverOverlayEl.classList.remove('open');
    performDeal();
  });

  // --- Card content per mode ---

  function trapContent() {
    return {
      isStory: false, isWin: false, isSeed: false,
      next: null, message: '', hint: '', backItem: null, puzzle: null,
      unlocks: [], requires: null,
    };
  }

  function buildCardContent(mode, numbers) {
    cardContent.clear();

    if (mode === 'hard') {
      buildHardCardContent(numbers);
      return;
    }

    const others = shuffle(numbers.filter((n) => n !== STORY_NUMBER)).slice(0, CHAIN_LENGTH - 1);
    const chain = [STORY_NUMBER, ...others];
    const chainSet = new Set(chain);

    chain.forEach((num, i) => {
      const isStory = i === 0;
      const isWin = i === chain.length - 1;
      const next = isWin ? null : chain[i + 1];

      let hint;
      let puzzle = null;
      if (isWin) {
        hint = 'The End';
      } else if (mode === 'easy') {
        puzzle = makeCipherPuzzle(next);
        hint = '\u{1F510} Solve the cipher to find your next card!';
      } else {
        hint = mediumHintText(next);
      }

      let message;
      if (isStory) {
        message = DECKS[mode].story;
      } else if (isWin) {
        message = '\u{1F389} You escaped!';
      } else {
        message = '✓ Nicely done!';
      }

      cardContent.set(num, { isStory, isWin, isSeed: isStory, next, message, hint, backItem: null, puzzle });
    });

    numbers.forEach((num) => {
      if (!chainSet.has(num)) cardContent.set(num, trapContent());
    });

    currentTarget = cardContent.get(STORY_NUMBER).next;
  }

  // Walks the combine chain and hands out items to each card: where two
  // freshly-unassigned parent cards combine, they get a matching illustrated
  // "A + B = C" triad; everywhere else falls back to a plain emoji item.
  function assignHardItems(chain, pairFor) {
    const itemForNumber = {};
    const comboPool = shuffle(COMBO_SETS.slice());
    const emojiPool = shuffle(ITEMS.slice());

    function nextEmoji() {
      if (emojiPool.length === 0) emojiPool.push(...shuffle(ITEMS.slice()));
      return emojiPool.pop();
    }

    for (let i = 2; i < chain.length; i++) {
      const sum = chain[i];
      const [a, b] = pairFor[sum];
      if (!itemForNumber[a] && !itemForNumber[b] && comboPool.length > 0) {
        const combo = comboPool.pop();
        itemForNumber[a] = combo.a;
        itemForNumber[b] = combo.b;
        itemForNumber[sum] = combo.c;
      } else {
        if (!itemForNumber[a]) itemForNumber[a] = nextEmoji();
        if (!itemForNumber[b]) itemForNumber[b] = nextEmoji();
        if (!itemForNumber[sum]) itemForNumber[sum] = nextEmoji();
      }
    }
    chain.forEach((num) => {
      if (!itemForNumber[num]) itemForNumber[num] = nextEmoji();
    });
    return itemForNumber;
  }

  function buildHardCardContent(numbers) {
    const { chain, pairFor } = buildHardChain(numbers);
    const chainSet = new Set(chain);
    const itemForNumber = assignHardItems(chain, pairFor);

    chain.forEach((num, i) => {
      const isStory = i === 0;
      const isSeed = i < 2;
      const isWin = i === chain.length - 1;
      const next = isWin ? null : chain[i + 1];

      let hint = '';
      if (isWin) {
        hint = 'The End';
      } else if (i >= 1) {
        const [a, b] = pairFor[next];
        const aItem = itemForNumber[a];
        const bItem = itemForNumber[b];
        hint = 'Add ' + itemVisual(aItem) + ' ' + aItem.name + ' and ' + itemVisual(bItem) + ' ' + bItem.name +
          ' to find your next card!';
      }

      let message;
      if (isStory) {
        message = DECKS.hard.story;
      } else if (isWin) {
        message = '\u{1F389} You escaped!';
      } else {
        message = '✓ Item found!';
      }

      cardContent.set(num, { isStory, isWin, isSeed, next, message, hint, backItem: itemForNumber[num], puzzle: null });
    });

    numbers.forEach((num) => {
      if (!chainSet.has(num)) cardContent.set(num, trapContent());
    });

    currentTarget = chain.length > 2 ? chain[2] : null;
  }

  // --- Story Mode: branching chain builder ---
  //
  // Builds an abstract graph of `usedCount` nodes (ids 0..usedCount-1,
  // created in the order below), independent of which real numbers end up
  // on the cards — buildStoryCardContent() maps ids to numbers afterward.
  //
  // Node kinds:
  //   story  — flavor text, explicitly unlocks 1-2 further nodes
  //   puzzle — a cipher; solving it reveals exactly 1 further node
  //   object — an item; unlocks nothing itself, just waits to be paired
  //   combo  — requires its two object nodes both flipped before it
  //            unlocks; once flipped it continues the chain like a story
  //            node
  //   win    — the escape card; every dead-end node unlocks it
  function buildStoryGraph(usedCount) {
    const nodes = [];
    function makeNode(kind) {
      const node = { id: nodes.length, kind, unlocks: [], requires: null, isStart: false, isWin: false };
      nodes.push(node);
      return node;
    }

    const root = makeNode('story');
    root.isStart = true;

    // Reserve one slot for root and one for the win card that closes every
    // dead-end branch, so the graph always lands on exactly usedCount nodes.
    let budget = usedCount - 2;
    const queue = [root];

    while (queue.length && budget > 0) {
      const node = queue.shift();
      // A puzzle only ever reveals a single answer, so it can't branch or
      // kick off a combo — it always gets exactly one child.
      const isPuzzle = node.kind === 'puzzle';
      const canCombo = !isPuzzle && budget >= 3;
      // The very first branch is always an object pair, so a combo (and
      // therefore its artwork) is guaranteed to appear every game.
      const wantsCombo = canCombo && (node.isStart || Math.random() < 0.28);

      if (wantsCombo) {
        const objA = makeNode('object');
        const objB = makeNode('object');
        const combo = makeNode('combo');
        combo.requires = [objA.id, objB.id];
        node.unlocks.push(objA.id, objB.id);
        queue.push(combo);
        budget -= 3;
      } else {
        const wantsTwo = !isPuzzle && budget >= 2 && Math.random() < 0.35;
        const childCount = wantsTwo ? 2 : 1;
        for (let i = 0; i < childCount && budget > 0; i++) {
          const kind = Math.random() < 0.55 ? 'story' : 'puzzle';
          const child = makeNode(kind);
          node.unlocks.push(child.id);
          queue.push(child);
          budget -= 1;
        }
      }
    }

    const win = makeNode('win');
    win.isWin = true;
    nodes.forEach((n) => {
      if (n === win || n.kind === 'object') return;
      if (n.unlocks.length === 0) n.unlocks.push(win.id);
    });

    // Safety net: with 55% story / 45% puzzle odds this is astronomically
    // likely already, but guarantee at least one puzzle exists regardless.
    if (!nodes.some((n) => n.kind === 'puzzle')) {
      const candidate = nodes.find((n) => n.kind === 'story' && !n.isStart);
      if (candidate) candidate.kind = 'puzzle';
    }

    return nodes;
  }

  // Hands each combo's two (always-fresh) ingredient nodes a matching
  // illustrated triad when artwork remains, otherwise a plain emoji item.
  function assignStoryItems(nodes) {
    const itemForId = {};
    const comboPool = shuffle(COMBO_SETS.slice());
    const emojiPool = shuffle(ITEMS.slice());

    function nextEmoji() {
      if (emojiPool.length === 0) emojiPool.push(...shuffle(ITEMS.slice()));
      return emojiPool.pop();
    }

    nodes.forEach((n) => {
      if (n.kind !== 'combo') return;
      const [aId, bId] = n.requires;
      if (comboPool.length > 0) {
        const combo = comboPool.pop();
        itemForId[aId] = combo.a;
        itemForId[bId] = combo.b;
        itemForId[n.id] = combo.c;
      } else {
        itemForId[aId] = nextEmoji();
        itemForId[bId] = nextEmoji();
        itemForId[n.id] = nextEmoji();
      }
    });

    return itemForId;
  }

  function describeUnlocks(nums) {
    if (!nums || nums.length === 0) return '';
    if (nums.length === 1) return 'Flip over card ' + nums[0] + '!';
    return 'Flip over cards ' + nums.join(' and ') + '!';
  }

  function buildStoryCardContent(numbers, usedCount) {
    cardContent.clear();
    const usedNumbers = numbers.slice(0, usedCount);
    const trapNumbers = numbers.slice(usedCount);

    const nodes = buildStoryGraph(usedCount);
    const numberForId = {};
    // Shuffle again before assigning: node ids are handed out in graph
    // creation order (root=0, its earliest children next, ...), and the
    // table is rendered in numeric order — without this, the root and its
    // first branches would always land on the smallest numbers and always
    // land in the same relative reading position.
    const shuffledUsedNumbers = shuffle(usedNumbers);
    nodes.forEach((n) => { numberForId[n.id] = shuffledUsedNumbers[n.id]; });
    const itemForId = assignStoryItems(nodes);

    nodes.forEach((n) => {
      const num = numberForId[n.id];
      const unlockNums = n.unlocks.map((id) => numberForId[id]);
      const requiresNums = n.requires ? n.requires.map((id) => numberForId[id]) : null;
      const backItem = itemForId[n.id] || null;

      let message = '';
      let hint = '';
      let puzzle = null;

      if (n.isStart) {
        message = DECKS.story.story;
        hint = describeUnlocks(unlockNums);
      } else if (n.isWin) {
        message = '\u{1F389} You escaped!';
        hint = 'The End';
      } else if (n.kind === 'puzzle') {
        puzzle = makeCipherPuzzle(unlockNums[0]);
        hint = '\u{1F510} Solve the cipher to find your next card!';
      } else if (n.kind === 'object') {
        // No "combine with ___" pointer — the player has to notice the
        // pairing themselves from the artwork.
        hint = '';
      } else {
        hint = describeUnlocks(unlockNums);
      }

      cardContent.set(num, {
        isStory: n.isStart, isWin: n.isWin, isSeed: n.isStart,
        unlocks: unlockNums, requires: requiresNums,
        message, hint, backItem, puzzle,
      });
    });

    trapNumbers.forEach((num) => cardContent.set(num, trapContent()));

    const rootNode = nodes.find((n) => n.isStart);
    const rootNumber = numberForId[rootNode.id];
    flippedNumbers = new Set([rootNumber]);
    unlockedNumbers = new Set(cardContent.get(rootNumber).unlocks);
  }

  // Marks a Story Mode card as flipped, applies whatever it explicitly
  // unlocks, then re-checks every pending combo in case this was the second
  // of its two required ingredients.
  function flipStoryCard(num, content) {
    unlockedNumbers.delete(num);
    flippedNumbers.add(num);
    content.unlocks.forEach((n) => unlockedNumbers.add(n));
    cardContent.forEach((c, cardNum) => {
      if (!c.requires || flippedNumbers.has(cardNum)) return;
      const [a, b] = c.requires;
      if (flippedNumbers.has(a) && flippedNumbers.has(b)) {
        unlockedNumbers.add(cardNum);
      }
    });
  }

  function tableSizeForMode(mode) {
    // Story Mode's table size isn't decided until it's dealt, so the
    // pre-deal preview shows the range rather than a committed number.
    return mode === 'story' ? (STORY_MODE_TABLE_SIZE_MIN + '–' + STORY_MODE_TABLE_SIZE_MAX) : CARD_COUNT;
  }

  function dealCards() {
    if (deckEl.dataset.empty === 'true') return;
    performDeal();
  }

  function performDeal() {
    tableEl.innerHTML = '';
    winOverlayEl.classList.remove('open');
    gameOverOverlayEl.classList.remove('open');
    zoomOverlay.classList.remove('open');
    mistakes = 0;
    let numbers;
    if (currentMode === 'story') {
      // Table size and the used/trap split both vary every deal, including
      // on "Play Again" — no two games have the same shape.
      const tableSize = randomInt(STORY_MODE_TABLE_SIZE_MIN, STORY_MODE_TABLE_SIZE_MAX);
      const usedRatio = STORY_MODE_USED_RATIO_MIN + Math.random() * (STORY_MODE_USED_RATIO_MAX - STORY_MODE_USED_RATIO_MIN);
      const usedCount = Math.round(tableSize * usedRatio);
      numbers = randomNumbers(tableSize, STORY_MODE_NUMBER_MAX);
      buildStoryCardContent(numbers, usedCount);
      // Card values stay random, but lay the table out in ascending order
      // so a "flip over card 47" hint is easy to scan for instead of a hunt.
      numbers = numbers.slice().sort((a, b) => a - b);
    } else {
      numbers = orderedNumbers(CARD_COUNT);
      buildCardContent(currentMode, numbers);
    }

    numbers.forEach((num, index) => {
      const content = cardContent.get(num);
      const card = document.createElement('div');
      card.className = 'card' + (content.isSeed ? ' flipped' : '');
      card.style.animationDelay = (index * 0.06) + 's';
      card.dataset.number = num;

      const hasArt = !!content.backItem;
      const iconInner = hasArt ? `<div class="front-icon">${itemVisual(content.backItem)}</div>` : '';
      // Only the story intro and the win card carry real flavor text — the
      // generic "Nicely done!" / "Item found!" line on every other card was
      // just clutter that pushed the hint off the bottom of the card, so a
      // correct guess is now shown with a sound + checkmark animation instead.
      const messageInner = (content.isStory || content.isWin) ? `<div class="message">${content.message}</div>` : '';
      // Item cards are just the picture — no hint text competing for room;
      // tap the flipped card to see what it unlocks in the zoom view instead.
      const hintInner = hasArt ? '' : `<div class="hint">${content.hint}</div>`;

      card.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-back">
            <div class="card-number">${num}</div>
          </div>
          <div class="card-face card-front${content.isStory ? ' story' : content.isWin ? ' win' : ''}${hasArt ? ' has-art' : ''}">
            <div class="front-number">#${num}</div>
            ${iconInner}
            ${messageInner}
            ${hintInner}
          </div>
        </div>
        <div class="wrong-mark">&#10005;</div>
        <div class="correct-mark">&#10003;</div>
      `;

      card.addEventListener('click', () => {
        if (card.classList.contains('flipped')) {
          openZoom(num);
          return;
        }
        const isCorrect = currentMode === 'story' ? unlockedNumbers.has(num) : num === currentTarget;
        if (!isCorrect) {
          triggerWrongFeedback(card);
          loseLife();
          return;
        }
        triggerCorrectFeedback(card);
        playCorrectSound();
        card.classList.add('flipped');
        if (currentMode === 'story') {
          flipStoryCard(num, content);
        } else {
          currentTarget = content.next;
        }
        if (content.isWin) {
          setTimeout(triggerWin, 700);
        }
      });
      tableEl.appendChild(card);
    });

    deckEl.dataset.empty = 'true';
    deckCountEl.textContent = '0';
    deckHintEl.textContent = 'All cards dealt';

    deckWrapEl.classList.remove('gone');
    deckWrapEl.style.display = '';
    deckWrapEl.classList.add('gone');
    deckWrapEl.addEventListener('transitionend', () => {
      deckWrapEl.style.display = 'none';
    }, { once: true });

    lives = MAX_LIVES;
    renderLives();
    startTime = Date.now();
  }

  deckEl.addEventListener('click', dealCards);

  // --- Win flow ---

  function triggerWin() {
    const elapsedMs = Date.now() - startTime;
    const progress = loadProgress();
    const prev = progress[currentMode] || {};
    const isNewBest = !prev.bestTimeMs || elapsedMs < prev.bestTimeMs;
    progress[currentMode] = {
      completed: true,
      bestTimeMs: isNewBest ? elapsedMs : prev.bestTimeMs,
    };
    saveProgress(progress);

    winTimeEl.textContent = formatTime(elapsedMs);
    winMistakesEl.textContent = mistakes === 0
      ? 'None — perfect run!'
      : mistakes + (mistakes === 1 ? ' mistake' : ' mistakes');
    winNewBestEl.hidden = !isNewBest;
    winOverlayEl.classList.add('open');
  }

  winPlayAgainEl.addEventListener('click', () => {
    winOverlayEl.classList.remove('open');
    performDeal();
  });

  winHomeEl.addEventListener('click', () => {
    winOverlayEl.classList.remove('open');
    goHome();
  });

  // --- Zoom overlay ---

  function openZoom(num) {
    const content = cardContent.get(num);
    zoomCardEl.classList.toggle('story', content.isStory);
    zoomCardEl.classList.toggle('win', content.isWin);
    zoomNumberEl.textContent = 'Card ' + num;
    if (content.backItem) {
      zoomItemArtEl.innerHTML = itemVisual(content.backItem);
      zoomItemArtEl.hidden = false;
    } else {
      zoomItemArtEl.hidden = true;
      zoomItemArtEl.innerHTML = '';
    }
    zoomMessageEl.textContent = content.message;

    const showPuzzle = content.puzzle && !content.puzzle.solved;
    zoomCardEl.classList.toggle('has-puzzle', showPuzzle);
    zoomHintEl.hidden = showPuzzle;
    zoomPuzzleEl.hidden = !showPuzzle;

    if (showPuzzle) {
      renderPuzzle(content, num);
    } else {
      zoomHintEl.innerHTML = content.puzzle ? ('Flip over card ' + content.puzzle.answer + '!') : content.hint;
    }

    zoomOverlay.classList.add('open');
  }

  function renderPuzzle(content, num, opts) {
    opts = opts || {};
    const isTest = !!opts.isTest;
    const p = content.puzzle;

    puzzleInstructionsEl.textContent = 'Each letter is shifted forward by ' + p.shift +
      ' in the alphabet. Tap a blank, then tap a letter — matching letters fill in too.';
    puzzleFeedbackEl.textContent = '';
    puzzleFeedbackEl.className = 'puzzle-feedback';
    puzzleAgainEl.hidden = true;
    puzzleRevealEl.hidden = true;
    puzzleRevealToggleEl.textContent = '\u{1F50D} Show Answer (dev)';
    puzzleRevealToggleEl.onclick = () => {
      const showing = !puzzleRevealEl.hidden;
      puzzleRevealEl.hidden = showing;
      puzzleRevealToggleEl.textContent = showing
        ? '\u{1F50D} Show Answer (dev)'
        : '\u{1F648} Hide Answer';
      puzzleRevealEl.textContent = 'Decoded: ' + p.reveal;
    };

    let activeIndex = -1;
    for (let i = 0; i < p.ciphertext.length; i++) {
      if (p.ciphertext[i] !== ' ' && !p.guesses[i]) {
        activeIndex = i;
        break;
      }
    }

    function advanceActive() {
      for (let i = activeIndex + 1; i < p.ciphertext.length; i++) {
        if (p.ciphertext[i] !== ' ' && !p.guesses[i]) {
          activeIndex = i;
          return;
        }
      }
      for (let i = 0; i < p.ciphertext.length; i++) {
        if (p.ciphertext[i] !== ' ' && !p.guesses[i]) {
          activeIndex = i;
          return;
        }
      }
      activeIndex = -1;
    }

    function solvePuzzle() {
      p.solved = true;
      puzzleFeedbackEl.className = 'puzzle-feedback correct';
      if (isTest) {
        puzzleFeedbackEl.textContent = '✓ Solved! ' + p.plaintext + ' (' + p.answer + ')';
        puzzleAgainEl.hidden = false;
      } else {
        puzzleFeedbackEl.textContent = '✓ Correct! Flip over card ' + p.answer + '!';
        const cardHintEl = document.querySelector('.card[data-number="' + num + '"] .hint');
        if (cardHintEl) cardHintEl.textContent = 'Flip over card ' + p.answer + '!';
        setTimeout(() => {
          zoomCardEl.classList.remove('has-puzzle');
          zoomHintEl.hidden = false;
          zoomPuzzleEl.hidden = true;
          zoomHintEl.textContent = 'Flip over card ' + p.answer + '!';
        }, 900);
      }
    }

    function checkComplete() {
      const allFilled = p.guesses.every((g, i) => p.ciphertext[i] === ' ' || g);
      if (!allFilled) return;
      const allCorrect = p.guesses.every((g, i) => p.ciphertext[i] === ' ' || g === p.plaintext[i]);
      if (allCorrect) {
        solvePuzzle();
      } else {
        puzzleFeedbackEl.textContent = 'Close! Fix the red letters.';
        puzzleFeedbackEl.className = 'puzzle-feedback wrong';
      }
    }

    function applyGuess(index, letter) {
      const ch = p.ciphertext[index];
      for (let i = 0; i < p.ciphertext.length; i++) {
        if (p.ciphertext[i] === ch) p.guesses[i] = letter;
      }
    }

    function clearGuess(index) {
      const ch = p.ciphertext[index];
      for (let i = 0; i < p.ciphertext.length; i++) {
        if (p.ciphertext[i] === ch) p.guesses[i] = null;
      }
    }

    function renderGrid() {
      cipherGridEl.innerHTML = '';
      let wordEl = null;
      p.ciphertext.split('').forEach((ch, i) => {
        if (ch === ' ') {
          wordEl = null;
          return;
        }
        if (!wordEl) {
          wordEl = document.createElement('div');
          wordEl.className = 'cipher-word';
          cipherGridEl.appendChild(wordEl);
        }
        const guess = p.guesses[i];
        const isCorrect = guess && guess === p.plaintext[i];
        const isWrong = guess && guess !== p.plaintext[i];

        const unit = document.createElement('div');
        unit.className = 'cipher-letter';
        unit.innerHTML = `
          <div class="cipher-cipherchar">${ch}</div>
          <div class="cipher-blank${i === activeIndex ? ' active' : ''}${isCorrect ? ' correct' : ''}${isWrong ? ' wrong' : ''}">${guess || '_'}</div>
        `;
        unit.querySelector('.cipher-blank').addEventListener('click', () => {
          activeIndex = i;
          renderGrid();
        });
        wordEl.appendChild(unit);
      });
    }

    function renderKeyboard() {
      cipherKeyboardEl.innerHTML = '';
      p.keyboard.forEach((letter) => {
        const key = document.createElement('button');
        key.className = 'cipher-key';
        key.textContent = letter;
        key.addEventListener('click', () => {
          if (activeIndex === -1 || p.solved) return;
          applyGuess(activeIndex, letter);
          advanceActive();
          renderGrid();
          checkComplete();
        });
        cipherKeyboardEl.appendChild(key);
      });
      const back = document.createElement('button');
      back.className = 'cipher-key cipher-key-back';
      back.textContent = '⌫';
      back.addEventListener('click', () => {
        if (p.solved) return;
        if (activeIndex !== -1 && p.guesses[activeIndex]) {
          clearGuess(activeIndex);
        } else {
          const from = activeIndex === -1 ? p.ciphertext.length : activeIndex;
          for (let i = from - 1; i >= 0; i--) {
            if (p.ciphertext[i] !== ' ') {
              activeIndex = i;
              clearGuess(i);
              break;
            }
          }
        }
        renderGrid();
        puzzleFeedbackEl.textContent = '';
        puzzleFeedbackEl.className = 'puzzle-feedback';
      });
      cipherKeyboardEl.appendChild(back);
    }

    renderGrid();
    renderKeyboard();

    puzzleAgainEl.onclick = () => {
      if (opts.onRetry) opts.onRetry();
    };
  }

  function openTestPuzzle(type) {
    const game = MINI_GAMES[type];
    let content = null;

    if (type === 'cipher') {
      const target = 1 + Math.floor(Math.random() * CARD_COUNT);
      content = {
        isStory: false,
        isWin: false,
        message: '\u{1F9EA} ' + game.label + ' — Test Mode',
        puzzle: makeCipherPuzzle(target),
        backItem: null,
      };
    }

    if (!content) return;

    zoomCardEl.classList.remove('story', 'win');
    zoomCardEl.classList.add('has-puzzle');
    zoomNumberEl.textContent = game.label + ' Test';
    zoomItemArtEl.hidden = true;
    zoomItemArtEl.innerHTML = '';
    zoomMessageEl.textContent = content.message;
    zoomHintEl.hidden = true;
    zoomPuzzleEl.hidden = false;

    renderPuzzle(content, null, { isTest: true, onRetry: () => openTestPuzzle(type) });

    zoomOverlay.classList.add('open');
  }

  function closeZoom() {
    zoomOverlay.classList.remove('open');
  }

  zoomCloseEl.addEventListener('click', closeZoom);
  zoomOverlay.addEventListener('click', (e) => {
    if (e.target === zoomOverlay) closeZoom();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeZoom();
  });

  // --- Init ---

  renderHome();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
