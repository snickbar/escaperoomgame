   <g font-family="Georgia,serif" fill="#4e3a28" text-anchor="middle"><text x="150" y="66" font-size="24" font-style="italic">Town Charter</text><text x="150" y="86" font-size="9" letter-spacing="2">OF THE COMMON GARDEN · 1872</text></g><path d="M60 98h180" stroke="#c99a3e" stroke-width="1.5"/>
   <text x="40" y="146" font-size="44" fill="#a6463b" font-family="Georgia,serif">B</text><g fill="#4e3a28" font-family="cursive" font-style="italic" font-size="11"><text x="72" y="124" font-size="11" >e it known that the garden</text><text x="72" y="144" font-size="11" >beyond Orchard Lane is given</text><text x="40" y="178" font-size="11" >to the people of this town, to</text><text x="40" y="198" font-size="11" >be kept for ever as common</text><text x="40" y="218" font-size="11" >ground, never to be sold.</text><text x="40" y="238" font-size="11" >Witnessed under seal by the</text><text x="40" y="258" font-size="11" >founders and the archivist.</text></g>
