<svg xmlns="http://www.w3.org/2000/svg" width="300" height="420" viewBox="0 0 300 420"><defs><pattern id="grain" width="7" height="9" patternUnits="userSpaceOnUse"><path d="M1 2h1m3 4h1" stroke="#a47f48" opacity=".11"/></pattern><radialGradient id="paper"><stop stop-color="#fff5d6"/><stop offset="1" stop-color="#d7b983"/></radialGradient></defs><path d="M0 0h300v420H0z" fill="url(#paper)"/><path d="M0 0h300v420H0z" fill="url(#grain)"/><path d="M23 0v420M0 176h300M0 349h300" stroke="#8e7350" opacity=".12"/><text x="30" y="39" fill="#775a37" font-family="Georgia,serif" font-size="10" letter-spacing="2">A FRAGMENT OF THE STORY</text><text x="27" y="72" fill="#4e493c" font-family="Georgia,serif" font-style="italic" font-size="21">From Ada’s notebook</text><g fill="#635a47" font-family="cursive" font-style="italic" font-size="13"><text x="28" y="104">Every shelf remembers.</text><text x="32" y="125">Some stories hide in plain sight.</text><text x="28" y="146">Follow the little discoveries;</text><text x="32" y="167">they will lead you home.</text></g><g fill="none" stroke="#806347" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M39 236q55-23 111 2 56-25 111-2v92q-56-21-111 0-55-21-111 0Zm111 2v90M56 253l71 1m-71 18h65m-65 19h71m46-37h69m-69 18h62m-62 19h69"/><path d="M195 215q30-41 45-15l-51 67m11-56 23 15"/></g><g transform="translate(229 378) rotate(-13)"><circle r="27" fill="none" stroke="#97704f" stroke-width="2" opacity=".6"/><text text-anchor="middle" y="3" fill="#97704f" font-family="Georgia" font-size="6.7">THE ARCHIVE</text></g><path d="m25 385 47-3 15 5 25-6 22 2" fill="none" stroke="#6c6350"/><text x="27" y="403" font-size="8" font-family="Georgia" fill="#89704c">Keep the pieces. They belong together.</text></svg>